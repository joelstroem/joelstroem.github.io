/* Beräkna lediga timmar för en resurs en given vecka */
function resWeekFreeHrs(res,wm,dayBookings){
  return wdays(wm).reduce((acc,d,di)=>{
    if(isDayOff(d))return acc;
    if(res.type==='konsult'&&!consultAvail(res,d))return acc;
    if(res.partTime?.fixedDays?.length>0&&!res.partTime.fixedDays.includes(di))return acc;
    if((dayBookings[res.id+'__'+iso(d)]||[]).length>0)return acc;
    return acc+8;
  },0);
}


function BehovListModal({behovItems,projMap,resources,dayBookings,onRemove,onUpdate,onClose}){
  const [editBh,setEditBh]=useState(null);
  function openEdit(bh){
    const wFrom=bh.weeks[0]?dateToWeekStr(bh.weeks[0]):'';
    const wTo=bh.weeks[bh.weeks.length-1]?dateToWeekStr(bh.weeks[bh.weeks.length-1]):'';
    setEditBh({id:bh.id,kompetens:bh.kompetens,wFrom,wTo});
  }
  function saveEdit(){
    if(!editBh||!editBh.wFrom||!editBh.wTo)return;
    const from=weekToMon(editBh.wFrom),to=weekToMon(editBh.wTo);
    if(from>to)return;
    const mons=[];let cur=from;
    while(cur<=to){mons.push(cur);const d=new Date(cur+'T12:00:00');d.setDate(d.getDate()+7);cur=iso(d);}
    onUpdate(editBh.id,mons);setEditBh(null);
  }
  const [matchFor,setMatchFor]=useState(null);
  const aktiva=resources.filter(r=>r.active&&r.type!=='behov');
  const matchMap=useMemo(()=>{
    const m={};
    behovItems.forEach(bh=>{
      const bhComps=roleToArr(bh.kompetens);
      const weeks=bh.weeks.map(mon=>new Date(mon+'T12:00:00'));
      const matched=aktiva.filter(res=>{
        if(!roleToArr(res.role).some(c=>bhComps.includes(c)))return false;
        return weeks.every(wm=>resWeekFreeHrs(res,wm,dayBookings)>0);
      }).map(res=>{
        const wkData=weeks.map(wm=>({wm,free:resWeekFreeHrs(res,wm,dayBookings)}));
        const totalFree=wkData.reduce((s,x)=>s+x.free,0);
        return{res,wkData,totalFree};
      }).filter(x=>x.totalFree>0).sort((a,b)=>b.totalFree-a.totalFree);
      m[bh.id]=matched;
    });
    return m;
  },[behovItems,aktiva,dayBookings]);
  return(
    <div className="overlay" onClick={onClose}><div className="modal modal-w" style={{maxWidth:560,display:'flex',flexDirection:'column',maxHeight:'90vh'}} onClick={e=>e.stopPropagation()}>
      <div className="modal-title" style={{color:'#d97706'}}>Aktiva behov ({behovItems.length})</div>

        {behovItems.length===0&&<p style={{color:'#6c757d',fontSize:13,padding:'12px 0'}}>Inga aktiva resursbehov.</p>}

          const proj=projMap[bh.projectId];
          const bhHrs=bh.weeks.reduce((s,mon)=>s+workDays(new Date(mon+'T12:00:00')).length*8,0);
          const w1=bh.weeks[0]?weekLabel(bh.weeks[0]):'—';
          const w2=bh.weeks[bh.weeks.length-1]?weekLabel(bh.weeks[bh.weeks.length-1]):'—';
          const matches=matchMap[bh.id]||[];
          return(
            <div key={bh.id} style={{border:'1.5px solid #e8eaed',borderRadius:10,padding:'10px 14px',marginBottom:8,background:'white'}}>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <div className="sm-av" style={{background:'#d97706',flexShrink:0}}>BH</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:13,color:'#1a1a2e'}}>Behov – {bh.kompetens}<span className="behov-badge" style={{marginLeft:5}}>BEHOV</span></div>
                  <div style={{fontSize:11,color:'#6c757d'}}>{proj?.id||bh.projectId} · {w1} – {w2} · {bhHrs}h</div>
                </div>
                {matches.length>0&&(
                <button onClick={()=>setMatchFor(bh.id)} style={{display:'flex',alignItems:'center',gap:4,padding:'3px 9px',borderRadius:6,border:'1.5px solid #6ee7b7',background:'#ecfdf5',color:'#059669',fontSize:11,fontWeight:600,cursor:'pointer',flexShrink:0}}>
                  <svg width="12" height="12" viewBox="0 0 12 12" fill="#059669" style={{flexShrink:0}}><circle cx="6" cy="3.5" r="2.5"/><path d="M1 11.5c0-2.76 2.24-5 5-5s5 2.24 5 5" strokeWidth="0"/></svg>{matches.length}

      <div className="modal-actions" style={{marginTop:12,flexShrink:0}}><button className="btn btn-cancel" onClick={onClose}>Stäng</button></div>
      {matchFor&&(()=>{
        const bh=behovItems.find(x=>x.id===matchFor);

        );
      })()}
      {editBh&&(
        <div className="overlay" style={{zIndex:201}} onClick={e=>{e.stopPropagation();setEditBh(null);}}>
          <div className="modal" style={{maxWidth:360}} onClick={e=>e.stopPropagation()}>
            <div className="modal-title" style={{fontSize:15}}>Hantera behov</div>
            <div style={{fontSize:12,color:'#6c757d',marginBottom:12}}>{editBh.kompetens}</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 12px'}}>
              <div className="field"><label>Från vecka</label><input type="week" value={editBh.wFrom} onChange={e=>setEditBh(v=>({...v,wFrom:e.target.value,wTo:v.wTo&&e.target.value>v.wTo?'':v.wTo}))}/></div>
              <div className="field" style={{marginBottom:12}}><label>Till vecka</label><input type="week" value={editBh.wTo} min={editBh.wFrom} onChange={e=>setEditBh(v=>({...v,wTo:e.target.value}))}/></div>
            </div>
            <div className="modal-actions">
              <button className="btn btn-cancel" onClick={()=>setEditBh(null)}>Avbryt</button>
              <button className="btn btn-save" disabled={!editBh.wFrom||!editBh.wTo||editBh.wFrom>editBh.wTo} onClick={saveEdit}>Spara</button>
            </div>
          </div>
        </div>
      )}
    </div></div>
  );
}

function SwapBehovModal({bh,resources,dayBookings,projMap,onSwap,onClose}){
  const realRes=[...resources.filter(r=>r.active)].sort((a,b)=>{const ak=a.type==='konsult'?1:0,bk=b.type==='konsult'?1:0;return ak!==bk?ak-bk:a.name.localeCompare(b.name,'sv');});
  const [selId,setSelId]=useState('');
  const [confirmed,setConfirmed]=useState(false);
  const conflicts=React.useMemo(()=>{
    if(!selId)return[];
    const conf=[];
    bh.weeks.forEach(mon=>{workDays(new Date(mon+'T12:00:00')).forEach(({d})=>{const ex=dayBookings[selId+'__'+iso(d)];if(ex&&ex.length>0)conf.push(iso(d));});});
    return conf;
  },[selId]);
  function doSwap(){if(!selId)return;if(conflicts.length>0&&!confirmed){setConfirmed(true);return;}onSwap(bh.id,selId);}
  const proj=projMap[bh.projectId];
  return(
    <div className="overlay" onClick={onClose}><div className="modal" style={{maxWidth:420}} onClick={e=>e.stopPropagation()}>
      <div className="modal-title">Byt ut behov</div>
      <p style={{fontSize:13,color:'#374151',marginBottom:14}}>Tilldela <strong>Behov – {bh.kompetens}</strong> ({proj?.id||bh.projectId}) till en riktig resurs.</p>
      <div className="field" style={{marginBottom:16}}>
        <select value={selId} onChange={e=>{setSelId(e.target.value);setConfirmed(false);}} style={{width:'100%',padding:'7px 10px',border:'1.5px solid #d1d5db',borderRadius:6,fontSize:13}}>
          <option value="">Välj resurs…</option>
          {realRes.map(r=><option key={r.id} value={r.id}>{r.name}{r.type==='konsult'?' (konsult)':''}</option>)}
        </select>
      </div>
      {selId&&conflicts.length>0&&<div style={{background:'#fff8e1',border:'1px solid #ffc107',borderRadius:6,padding:'10px 12px',marginBottom:14,fontSize:12,color:'#856404'}}>
        ⚠ {realRes.find(r=>r.id===selId)?.name} har {conflicts.length} dag{conflicts.length>1?'ar':''} med befintliga bokningar under denna period. Dessa bevaras — dubbelbokning kan uppstå.
      </div>}
      {confirmed&&<div style={{background:'#fee2e2',border:'1px solid #f87171',borderRadius:6,padding:'10px 12px',marginBottom:14,fontSize:12,color:'#991b1b'}}>Vill du fortsätta? Behovet försvinner och bokningarna läggs på {realRes.find(r=>r.id===selId)?.name}.</div>}
      <div className="modal-actions">
        <button className="btn btn-cancel" onClick={onClose}>Avbryt</button>
        <button className="btn" style={{background:confirmed?'#e63946':'#d97706',color:'white',fontWeight:600,padding:'6px 16px',border:'none',opacity:selId?1:.5}} disabled={!selId} onClick={doSwap}>{confirmed?'Bekräfta byte':conflicts.length>0?'Byt ut (med konflikt)':'Byt ut →'}</button>
      </div>
    </div></div>
  );
}

/* ════════════ ADMIN MODALS ════════════ */

function AdminLoginModal({admins,onLogin,onClose}){
  const [name,setName]=useState('');
  const [pw,setPw]=useState('');
  const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);
  async function doLogin(e){
    e.preventDefault();
    setBusy(true);setErr('');
    const hash=await sha256(pw);
    const match=admins.find(a=>a.name===name&&a.hash===hash);
    if(match){onLogin(match.name);}
    else{setErr('Fel användarnamn eller lösenord.');setBusy(false);}
  }
  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{maxWidth:360}} onClick={e=>e.stopPropagation()}>
        <div className="modal-title">🔐 Admin — logga in</div>
        <form onSubmit={doLogin} style={{display:'flex',flexDirection:'column',gap:14}}>
          <div className="field" style={{marginBottom:0}}>
            <label>Användarnamn</label>
            <input className="finput" value={name} onChange={e=>setName(e.target.value)} autoFocus/>
          </div>
          <div className="field" style={{marginBottom:0}}>
            <label>Lösenord</label>
            <input type="password" className="finput" value={pw} onChange={e=>setPw(e.target.value)}/>
          </div>
          {err&&<div style={{fontSize:13,color:'#e63946'}}>{err}</div>}
          <div className="modal-actions">
            <button type="button" className="btn btn-cancel" onClick={onClose}>Avbryt</button>
            <button type="submit" className="btn btn-dark" style={{opacity:(name&&pw&&!busy)?1:.5}} disabled={!name||!pw||busy}>Logga in</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function AdminSetupModal({onSetup,onClose}){
  const [name,setName]=useState('');
  const [pw,setPw]=useState('');
  const [pw2,setPw2]=useState('');
  const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);
  async function doSetup(e){
    e.preventDefault();
    if(pw!==pw2){setErr('Lösenorden matchar inte.');return;}
    if(pw.length<6){setErr('Lösenordet måste vara minst 6 tecken.');return;}
    if(!name.trim()){setErr('Ange ett användarnamn.');return;}
    setBusy(true);setErr('');
    const hash=await sha256(pw);
    onSetup(name.trim(),hash);
  }
  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{maxWidth:380}} onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Skapa första admin-kontot</div>
        <p style={{fontSize:13,color:'#6c757d',marginBottom:16}}>Inga admins är skapade ännu. Skapa det första kontot nedan.</p>
        <form onSubmit={doSetup} style={{display:'flex',flexDirection:'column',gap:14}}>
          <div className="field" style={{marginBottom:0}}>
            <label>Användarnamn</label>
            <input className="finput" value={name} onChange={e=>setName(e.target.value)} autoFocus/>
          </div>
          <div className="field" style={{marginBottom:0}}>
            <label>Lösenord</label>
            <input type="password" className="finput" value={pw} onChange={e=>setPw(e.target.value)}/>
          </div>
          <div className="field" style={{marginBottom:0}}>
            <label>Bekräfta lösenord</label>
            <input type="password" className="finput" value={pw2} onChange={e=>setPw2(e.target.value)}/>
          </div>
          {err&&<div style={{fontSize:13,color:'#e63946'}}>{err}</div>}
          <div className="modal-actions">
            <button type="button" className="btn btn-cancel" onClick={onClose}>Avbryt</button>
            <button type="submit" className="btn btn-dark" style={{opacity:(name&&pw&&pw2&&!busy)?1:.5}} disabled={!name||!pw||!pw2||busy}>Skapa konto</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function AdminManageModal({admins,currentAdmin,onAdd,onRemove,onChangePassword,onClose}){
  const [tab,setTab]=useState('list');
  const [newName,setNewName]=useState('');
  const [newPw,setNewPw]=useState('');
  const [newPw2,setNewPw2]=useState('');
  const [changePwFor,setChangePwFor]=useState('');
  const [cpw,setCpw]=useState('');
  const [cpw2,setCpw2]=useState('');
  const [err,setErr]=useState('');
  const [msg,setMsg]=useState('');
  const [busy,setBusy]=useState(false);
  async function doAdd(e){
    e.preventDefault();
    if(newPw!==newPw2){setErr('Lösenorden matchar inte.');return;}
    if(newPw.length<6){setErr('Minst 6 tecken.');return;}
    if(admins.find(a=>a.name===newName)){setErr('Användarnamnet är redan taget.');return;}
    setBusy(true);setErr('');
    const hash=await sha256(newPw);
    onAdd(newName,hash);
    setMsg(`Kontot "${newName}" skapat.`);
    setNewName('');setNewPw('');setNewPw2('');setTab('list');setBusy(false);
  }
  async function doChangePw(e){
    e.preventDefault();
    if(cpw!==cpw2){setErr('Lösenorden matchar inte.');return;}
    if(cpw.length<6){setErr('Minst 6 tecken.');return;}
    setBusy(true);setErr('');
    const hash=await sha256(cpw);
    onChangePassword(changePwFor,hash);
    setMsg(`Lösenordet för "${changePwFor}" uppdaterat.`);
    setCpw('');setCpw2('');setChangePwFor('');setTab('list');setBusy(false);
  }
  const smBtn={fontSize:12,padding:'3px 10px',border:'1px solid #d1d5db',borderRadius:4,background:'white',cursor:'pointer',marginLeft:4,fontFamily:'inherit'};
  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal modal-w" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Hantera admins</div>
        <div style={{display:'flex',gap:6,marginBottom:16}}>
          {['list','add'].map(t=><button key={t} onClick={()=>{setTab(t);setErr('');setMsg('');}} style={{fontSize:13,padding:'4px 12px',border:'1px solid #d1d5db',borderRadius:6,cursor:'pointer',background:tab===t?'#1a1a2e':'white',color:tab===t?'white':'#374151',fontWeight:tab===t?700:400,fontFamily:'inherit'}}>{t==='list'?'Användare':'Lägg till'}</button>)}
        </div>
        {msg&&<div style={{fontSize:13,color:'#10b981',marginBottom:10}}>{msg}</div>}
        {err&&<div style={{fontSize:13,color:'#e63946',marginBottom:10}}>{err}</div>}
        {tab==='list'&&<div style={{minHeight:120}}>
          {admins.length===0&&<div style={{fontSize:13,color:'#9ca3af'}}>Inga admin-konton.</div>}
          {admins.map(a=>(
            <div key={a.name} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid #f3f4f6',fontSize:14}}>
              <span style={{fontWeight:a.name===currentAdmin?700:400}}>{a.name}{a.name===currentAdmin&&<span style={{fontSize:11,color:'#6b7280',marginLeft:6}}>(du)</span>}</span>
              <div>
                <button style={smBtn} onClick={()=>{setChangePwFor(a.name);setTab('changepw');setErr('');setMsg('');}}>Byt lösenord</button>
                {a.name!==currentAdmin&&<button style={{...smBtn,color:'#e63946',borderColor:'#fca5a5'}} onClick={()=>{if(window.confirm(`Ta bort admin "${a.name}"?`))onRemove(a.name);}}>Ta bort</button>}
              </div>
            </div>
          ))}
        </div>}
        {tab==='add'&&<form onSubmit={doAdd} style={{display:'flex',flexDirection:'column',gap:12,minHeight:120}}>
          <div className="field" style={{marginBottom:0}}><label>Användarnamn</label><input className="finput" value={newName} onChange={e=>setNewName(e.target.value)} autoFocus/></div>
          <div className="field" style={{marginBottom:0}}><label>Lösenord</label><input type="password" className="finput" value={newPw} onChange={e=>setNewPw(e.target.value)}/></div>
          <div className="field" style={{marginBottom:0}}><label>Bekräfta lösenord</label><input type="password" className="finput" value={newPw2} onChange={e=>setNewPw2(e.target.value)}/></div>
          <div className="modal-actions"><button type="button" className="btn btn-cancel" onClick={()=>{setTab('list');setErr('');}}>Avbryt</button><button type="submit" className="btn btn-dark" style={{opacity:(newName&&newPw&&newPw2&&!busy)?1:.5}} disabled={!newName||!newPw||!newPw2||busy}>Skapa</button></div>
        </form>}
        {tab==='changepw'&&<form onSubmit={doChangePw} style={{display:'flex',flexDirection:'column',gap:12,minHeight:120}}>
          <div style={{fontSize:13,color:'#374151',marginBottom:2}}>Byter lösenord för <strong>{changePwFor}</strong></div>
          <div className="field" style={{marginBottom:0}}><label>Nytt lösenord</label><input type="password" className="finput" value={cpw} onChange={e=>setCpw(e.target.value)} autoFocus/></div>
          <div className="field" style={{marginBottom:0}}><label>Bekräfta</label><input type="password" className="finput" value={cpw2} onChange={e=>setCpw2(e.target.value)}/></div>
          <div className="modal-actions"><button type="button" className="btn btn-cancel" onClick={()=>{setTab('list');setErr('');}}>Avbryt</button><button type="submit" className="btn btn-dark" style={{opacity:(cpw&&cpw2&&!busy)?1:.5}} disabled={!cpw||!cpw2||busy}>Spara</button></div>
        </form>}
        <div className="modal-actions" style={{marginTop:20,borderTop:'1px solid #e5e7eb',paddingTop:14}}>
          <button className="btn btn-cancel" onClick={onClose}>Stäng</button>
        </div>
      </div>
    </div>
  );
}

function AuditLogModal({auditLog,onClose}){
  const fmt2=ts=>new Date(ts).toLocaleString('sv-SE',{dateStyle:'short',timeStyle:'short'});
  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{maxWidth:560,maxHeight:'85vh',display:'flex',flexDirection:'column'}} onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Granskningslogg</div>
        <div style={{overflowY:'auto',flex:1}}>
          {(!auditLog||auditLog.length===0)&&<div style={{fontSize:13,color:'#9ca3af',padding:'20px 0',textAlign:'center'}}>Inga loggposter ännu.</div>}
          {auditLog&&auditLog.length>0&&(
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead>
                <tr style={{background:'#f8f9fa'}}>
                  <th style={{padding:'6px 8px',textAlign:'left',fontWeight:700,borderBottom:'2px solid #e5e7eb'}}>Tid</th>
                  <th style={{padding:'6px 8px',textAlign:'left',fontWeight:700,borderBottom:'2px solid #e5e7eb'}}>Admin</th>

          <button className="btn btn-cancel" onClick={onClose}>Stäng</button>
        </div>
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(e){return{error:e};}
  render(){
    if(this.state.error){
      return React.createElement('div',{style:{padding:24,fontFamily:'monospace',background:'#fee2e2',border:'2px solid #e63946',borderRadius:8,margin:24}},
        React.createElement('h2',{style:{color:'#e63946',marginBottom:12}},'⚠ App-fel'),
        React.createElement('pre',{style:{whiteSpace:'pre-wrap',fontSize:12,color:'#333'}},this.state.error.stack||this.state.error.message)
      );
    }
    return this.props.children;
  }
}
ReactDOM.render(React.createElement(ErrorBoundary,null,React.createElement(App,null)),document.getElementById('root'));
</script>
