<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resursplanering — 3Button Group</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-y: scroll; } /* reserverar scrollbar-utrymme alltid — förhindrar layout-hopp när modal öppnas */
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; }

.header { background: #1a1a2e; color: white; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.header-brand { display: flex; align-items: center; gap: 12px; }
/* .logo replaced by SVG */
.header-title { font-size: 16px; font-weight: 600; }
.user-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #adb5bd; }
.hdr-av { width: 28px; height: 28px; border-radius: 50%; background: #6b7280; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: white; flex-shrink: 0; }

.toolbar { background: white; border-bottom: 1px solid #e8eaed; padding: 10px 24px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.view-toggle { display: flex; background: #f0f2f5; border-radius: 8px; padding: 3px; gap: 2px; }
.view-btn { padding: 5px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; background: transparent; color: #6c757d; transition: all .15s; }
.view-btn.active { background: white; color: #1a1a2e; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.week-label { font-size: 13px; color: #495057; font-weight: 500; }
.today-btn { padding: 5px 12px; border-radius: 6px; border: 1px solid #dee2e6; background: white; cursor: pointer; font-size: 12px; font-weight: 500; color: #495057; }
.today-btn:hover { background: #f8f9fa; }
.tb-spacer { flex: 1; }
.add-btn { padding: 6px 14px; border-radius: 8px; border: none; background: #e63946; color: white; font-size: 13px; font-weight: 600; cursor: pointer; }
.add-btn:hover { background: #c1121f; }
.mgmt-btn { padding: 5px 11px; border-radius: 7px; border: 1px solid #dee2e6; background: white; font-size: 12px; font-weight: 500; color: #495057; cursor: pointer; white-space: nowrap; }
.mgmt-btn:hover { background: #f8f9fa; }
.tb-sep { width: 1px; height: 20px; background: #e8eaed; flex-shrink: 0; }

.filter-bar { background: white; border-bottom: 1px solid #e8eaed; padding: 8px 24px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fsearch { display: flex; align-items: center; gap: 6px; background: #f8f9fa; border: 1px solid #e8eaed; border-radius: 7px; padding: 5px 10px; }
.fsearch:focus-within { border-color: #adb5bd; background: white; }
.fsearch input { border: none; background: transparent; outline: none; font-size: 13px; color: #1a1a2e; width: 150px; }
.fsearch input::placeholder { color: #adb5bd; }
.ms-wrap { position: relative; }
.ms-btn { padding: 6px 10px; border: 1px solid #e8eaed; border-radius: 7px; background: #f8f9fa; font-size: 13px; color: #495057; cursor: pointer; display: flex; align-items: center; gap: 5px; user-select: none; white-space: nowrap; }
.ms-btn.active { border-color: #457b9d; background: #edf3f8; color: #1a1a2e; font-weight: 500; }
.ms-drop { position: absolute; top: calc(100% + 4px); left: 0; background: white; border: 1px solid #dee2e6; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.12); z-index: 100; min-width: 300px; max-height: 260px; overflow-y: auto; padding: 4px 0; }
.ms-item { display: flex; align-items: center; gap: 9px; padding: 7px 14px; cursor: pointer; font-size: 13px; color: #1a1a2e; white-space: nowrap; }
.ms-item:hover { background: #f8f9fa; }
.ms-item.checked { background: #f0f6ff; }
.ms-cb { width: 14px; height: 14px; flex-shrink: 0; }
.fclear { padding: 5px 11px; border-radius: 7px; border: 1px solid #dee2e6; background: white; font-size: 12px; color: #6c757d; cursor: pointer; }
.fclear:hover { background: #f8f9fa; }

.main { padding: 20px 24px; }
.grid-wrap { background: white; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.pt { border-collapse: separate; border-spacing: 0; }
.pt th, .pt td { border-right: 1px solid #f0f2f5; border-bottom: 1px solid #f0f2f5; }

/* Sticky left columns — 250px person (fits "Andreas Ivansson KONSULT" fully), 106px proj */
.c-person { position: sticky; left: 0; z-index: 12; min-width: 250px; max-width: 250px; width: 250px; background: white; }
.c-proj   { position: sticky; left: 250px; z-index: 12; min-width: 106px; max-width: 106px; width: 106px; background: white; border-right: 2px solid #e8eaed !important; }
.c-proj::before { content:''; position:absolute; top:0; bottom:0; left:-4px; width:4px; background:inherit; }
thead .c-person, thead .c-proj { z-index: 13; background: #f8f9fa; border-bottom: 2px solid #e8eaed !important; padding: 9px 10px; font-size: 11px; font-weight: 600; color: #6c757d; text-transform: uppercase; letter-spacing: .4px; }
.pv-table .c-person { border-right: 2px solid #e8eaed !important; }
.pv-table thead .c-person { z-index: 13; background: #f8f9fa; border-bottom: 2px solid #e8eaed !important; }

.sr .c-person, .sr .c-proj { background: #f8f9fa; }
.sr:hover .c-person, .sr:hover .c-proj { background: #edf0f3; }
.dr:hover .c-person, .dr:hover .c-proj { background: #fafbfc; }
.pv-table .sr .c-person { background: #f8f9fa; }
.pv-table .sr:hover .c-person { background: #edf0f3; }
.pv-table .dr:hover .c-person { background: #fafbfc; }
.sr.over-row .c-person, .sr.over-row .c-proj { background: #fff0f0; }
.sr.over-row td { background: #fff0f0; }
.sr.over-row:hover .c-person, .sr.over-row:hover .c-proj { background: #ffe3e3; }
.sr.over-row:hover td { background: #ffe3e3; }

/* Sticky right TOTALT */
.c-totalt { position: sticky; right: 0; z-index: 12; background: white; border-left: 2px solid #e8eaed !important; min-width: 58px; width: 58px; text-align: center; }
thead .c-totalt { z-index: 13; background: #f8f9fa; border-bottom: 2px solid #e8eaed !important; padding: 9px 6px; font-size: 11px; font-weight: 600; color: #6c757d; text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; }
.sr .c-totalt { background: #f8f9fa; font-size: 13px; font-weight: 700; color: #1a1a2e; padding: 4px 6px; }
.dr .c-totalt { font-size: 12px; font-weight: 700; color: #374151; padding: 4px 6px; }
.sr.over-row .c-totalt { background: #fff0f0; }
.sr.over-row:hover .c-totalt { background: #ffe3e3; }
.sr:hover .c-totalt { background: #edf0f3; }
.dr:hover .c-totalt { background: #fafbfc; }

/* Person cell */
.person-cell { padding: 5px 8px; display: flex; align-items: center; gap: 7px; }
.res-av { width: 26px; height: 26px; border-radius: 50%; background: #e63946; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: white; flex-shrink: 0; }
.res-av.over { background: #c1121f; }
.person-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.person-name { font-size: 12px; font-weight: 600; color: #1a1a2e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person-role-sub { font-size: 10px; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.person-add-btn { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid #d1d5db; background: white; color: #6c757d; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; transition: all .15s; }
.person-add-btn:hover { background: #e63946; color: white; border-color: #e63946; }

/* Proj column */
.proj-lbl { padding: 5px 8px; font-size: 10px; font-weight: 600; color: #adb5bd; text-transform: uppercase; letter-spacing: .4px; }
.proj-sc { padding: 4px 6px 4px 8px; }
.proj-sc-top { display: flex; align-items: center; }
.proj-sc-id { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
.pjdot { width: 7px; height: 7px; border-radius: 2px; background: #6b7280; flex-shrink: 0; }
.pjcode { font-size: 12px; font-weight: 700; font-family: monospace; color: #1a1a2e; white-space: nowrap; }
.proj-sc-right { display: flex; align-items: center; gap: 3px; margin-left: auto; flex-shrink: 0; }
.proj-rm-btn { width: 16px; height: 16px; border-radius: 3px; border: 1px solid #fca5a5; background: #fff1f2; color: #e63946; cursor: pointer; font-size: 13px; font-weight: 300; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; }
.proj-rm-btn:hover { background: #fee2e2; }
.pjname { font-size: 11px; color: #6c757d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: 6px; }

/* Week headers */
.th-week { background: #f8f9fa; padding: 0; border-bottom: 1px solid #e8eaed !important; border-right: 2px solid #e8eaed !important; }
.th-week-inner { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 4px; gap: 1px; cursor: pointer; user-select: none; transition: background .15s; width: 52px; }
.th-week-inner:hover { background: #edf0f3; }
.th-week-inner-exp { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px; gap: 4px; cursor: pointer; user-select: none; transition: background .15s; }
.th-week-inner-exp:hover { background: #edf0f3; }
.wk-num { font-size: 12px; font-weight: 700; color: #1a1a2e; }
.wk-num.today { color: #e63946; }
.wk-date { font-size: 9px; color: #adb5bd; display: block; font-weight: 400; white-space: nowrap; }
.wk-star { font-size: 7px; color: #e63946; margin-left: 1px; vertical-align: super; }
.exp-icon { font-size: 9px; color: #adb5bd; transition: transform .2s; flex-shrink: 0; }
.exp-icon.open { transform: rotate(90deg); }
/* Day headers — fixed 26px each */
.th-day { background: #f8f9fa; padding: 4px 0; text-align: center; font-size: 9px; font-weight: 600; color: #6c757d; width: 26px; min-width: 26px; max-width: 26px; border-bottom: 2px solid #e8eaed !important; }
.th-day-last { border-right: 2px solid #e8eaed !important; }

.sr td { background: #f8f9fa; border-top: 2px solid #c8d0da !important; }
.sr:hover td { background: #edf0f3; }
.dr:hover td { background: #fafbfc; }
.dr-last td { border-bottom: 2px solid #c8d0da !important; }

/* Week data cells */
.td-week { padding: 3px 4px; border-right: 2px solid #e8eaed !important; width: 52px; min-width: 52px; max-width: 52px; }
.td-week-s { padding: 2px 3px; border-right: 2px solid #e8eaed !important; width: 52px; min-width: 52px; max-width: 52px; }
/* Day data cells — same fixed 26px as headers */
.td-day { padding: 3px 2px; text-align: center; width: 26px; min-width: 26px; max-width: 26px; }
.td-day-last { border-right: 2px solid #e8eaed !important; }
.td-day.over-day { background: rgba(230,57,70,.07) !important; }

/* Historik-veckor — nedtonade */
.th-week.is-past { opacity: 0.45; }
.is-past .wchip, .is-past .wchip-e, .is-past .sc, .is-past .dchip, .is-past .dchip-e { opacity: 0.45; }
td.is-past { background: #fafafa !important; }

/* Year marker */
.th-week.year-start { border-left: 3px solid #1a1a2e !important; }
.td-week.year-start, .td-week-s.year-start { border-left: 3px solid #1a1a2e !important; }
.wk-year-badge { display: inline-block; font-size: 8px; font-weight: 800; color: white; background: #1a1a2e; border-radius: 3px; padding: 1px 4px; margin-bottom: 2px; letter-spacing: .3px; }

/* Chips */
.wchip { height: 24px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: white; background: #6b7280; }
.wchip:hover { filter: brightness(.88); }
.wchip.red { background: #e63946 !important; }
.wchip-e { height: 24px; border-radius: 4px; border: 1.5px dashed #d1d5db; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.wchip-e:hover { border-color: #e63946; }
.wchip-e:hover::after { content: '+'; color: #e63946; font-size: 14px; }
.dchip { height: 24px; border-radius: 3px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: white; background: #6b7280; }
.dchip:hover { filter: brightness(.88); }
.dchip.red { background: #e63946 !important; }
.dchip-e { height: 24px; border-radius: 3px; border: 1.5px dashed #d1d5db; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.dchip-e:hover { border-color: #e63946; }
.dchip-e:hover::after { content: '+'; color: #e63946; font-size: 12px; }
.dchip-h { height: 24px; border-radius: 3px; border: 1.5px solid #d1d5db; background: transparent; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #9ca3af; cursor: not-allowed; }
.dchip-h.clickable { cursor: pointer; }
.dchip-h.clickable:hover { border-color: #f06820; color: #f06820; }
.wchip-off { height: 24px; border-radius: 4px; background: #e9ecef; display: flex; align-items: center; justify-content: center; cursor: not-allowed; }
.dchip-off { height: 24px; border-radius: 3px; background: #e9ecef; display: flex; align-items: center; justify-content: center; cursor: not-allowed; }
.wchip.hk { background: #f06820 !important; }
.dchip.hk { background: #f06820 !important; }
.hk-check { display:flex; align-items:center; gap:6px; font-size:13px; color:#374151; margin:8px 0 4px; cursor:pointer; user-select:none; }
.hk-check input { width:15px; height:15px; accent-color:#f06820; cursor:pointer; }
.behov-badge { font-size:9px; font-weight:700; background:#c9930a; color:white; border-radius:3px; padding:1px 4px; margin-left:5px; vertical-align:middle; }
.swap-btn { font-size:10px; padding:2px 8px; border:1.5px solid #c9930a; border-radius:4px; background:white; color:#c9930a; cursor:pointer; font-weight:600; flex-shrink:0; }
.swap-btn:hover { background:#c9930a; color:white; }

/* Summa compact */
.sc { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 3px; }
.sc-hrs { font-size: 11px; font-weight: 700; }
.ddots { display: flex; gap: 2px; }
.dd { flex: 1; height: 7px; border-radius: 2px; min-width: 6px; max-width: 10px; background: #e2e8f0; position: relative; overflow: hidden; }
.dd.on { background: #6b7280; }
.dd.led { background: #e63946; }
.dd.hk { background: #f06820; }
.dd.hday { background: transparent; border: 1px solid #9ca3af; }
.dd.hday::after { content: '×'; position: absolute; font-size: 6px; color: #9ca3af; line-height: 1; top: 50%; left: 50%; transform: translate(-50%,-50%); }
.th-day-off { opacity: 0.45; }
.util-bar { width: 100%; height: 3px; background: #e8eaed; border-radius: 2px; }
.util-fill { height: 3px; border-radius: 2px; }

/* Project card (projektvy) */
.proj-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.1); margin-bottom: 20px; overflow: hidden; border: 1.5px solid #d0d7de; }
.proj-card-head { padding: 10px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #f0f2f5; }
.proj-bar { width: 4px; height: 28px; border-radius: 2px; background: #6b7280; flex-shrink: 0; }
.proj-badge { font-family: monospace; font-size: 13px; font-weight: 700; color: #1a1a2e; padding: 0; }
.proj-card-name { font-size: 13px; font-weight: 400; color: #6c757d; }
.proj-pl { margin-left: auto; font-size: 12px; color: #6c757d; }
.find-btn { width:20px;height:20px;border-radius:4px;border:1.5px solid #93c5fd;background:#eff6ff;color:#3b82f6;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;transition:all .15s;margin-left:2px;padding:0; }
.find-btn:hover,.find-btn.active { background:#2563eb;color:white;border-color:#2563eb; }

/* Modals */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: white; border-radius: 16px; padding: 26px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.modal-w { max-width: 460px; }
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 18px; cursor: default; user-select: none; }
.modal-title:active { cursor: default; }
.modal-sub { font-size: 11px; font-weight: 600; color: #6c757d; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 8px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; font-weight: 600; color: #6c757d; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 5px; }
.field select, .field input[type=text] { width: 100%; padding: 9px 11px; border: 1.5px solid #dee2e6; border-radius: 8px; font-size: 14px; outline: none; background: white; font-family: inherit; }
.field select:focus, .field input[type=text]:focus { border-color: #e63946; }
.finput { display: block; width: 100%; padding: 9px 11px; border: 1.5px solid #dee2e6; border-radius: 8px; font-size: 14px; outline: none; background: white; font-family: inherit; box-sizing: border-box; }
.finput:focus { border-color: #e63946; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
.btn { padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; }
.btn-cancel { background: #f8f9fa; border: 1.5px solid #dee2e6; color: #495057; }
.btn-save { background: #e63946; color: white; font-weight: 600; }
.btn-save:disabled { opacity: .5; cursor: not-allowed; }
.btn-dark { background: #1a1a2e; color: white; font-weight: 600; }
.btn-dark:disabled { opacity: .5; cursor: not-allowed; }
.btn-del { background: #fff5f5; color: #e63946; border: 1px solid #ffc9c9; }
.dpick { display: flex; gap: 6px; margin-top: 8px; }
.dtog { flex: 1; padding: 7px 0; border-radius: 6px; border: 1.5px solid #dee2e6; background: white; cursor: pointer; font-size: 12px; font-weight: 600; color: #6c757d; text-align: center; }
.dtog.on { background: #6b7280; border-color: #6b7280; color: white; }
.dtog.hday { background: #f1f5f9; border-color: #e2e8f0; color: #bbc3ce; cursor: pointer; font-size: 9px; }
.dtog.hday.on { background: #6b7280 !important; border-color: #6b7280 !important; color: white !important; font-size: 9px; }
.mgmt-box { background: #f8f9fa; border-radius: 10px; padding: 14px; margin-bottom: 16px; }
.mgmt-list { max-height: 230px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.mgmt-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; }
.mgmt-item:hover { background: #f8f9fa; }
.mgmt-nm { flex: 1; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mgmt-rl { font-size: 11px; color: #6c757d; white-space: nowrap; }
.sm-av { width: 22px; height: 22px; border-radius: 50%; background: #e63946; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; color: white; flex-shrink: 0; }
.btn-rm { width: 22px; height: 22px; border-radius: 5px; border: 1px solid #fca5a5; background: #fff5f5; color: #e63946; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.btn-rm:hover { background: #fee2e2; }
.confirm-msg { font-size: 14px; color: #374151; line-height: 1.55; margin-bottom: 22px; }
.empty-state { text-align: center; padding: 48px 20px; color: #adb5bd; font-size: 14px; }
.toast { position: fixed; bottom: 24px; right: 24px; background: #1a1a2e; color: white; padding: 11px 18px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 20px rgba(0,0,0,.2); z-index: 300; animation: up .2s ease; }
@keyframes up { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ── Konsult utanför tillgänglighetsperiod — chip med prickmönster ── */
.konsult-outside { cursor: not-allowed; }
.wchip-outside { height: 24px; border-radius: 4px; background-color: #f0f2f5; background-image: radial-gradient(circle, #b0bac8 1px, transparent 1px); background-size: 7px 7px; cursor: not-allowed; width: 100%; box-sizing: border-box; }
.dchip-outside { height: 24px; border-radius: 3px; background-color: #f0f2f5; background-image: radial-gradient(circle, #b0bac8 1px, transparent 1px); background-size: 6px 6px; cursor: not-allowed; width: 100%; }
.ms-badge { display:inline-block; font-size:8px; font-weight:800; color:white; border-radius:3px; padding:1px 4px; margin-bottom:1px; letter-spacing:.3px; }
.ms-fat { background:#3b82f6; }
.ms-sat { background:#e63946; }
.th-week.has-milestone { border-top: 2px solid transparent; }

  const resProjs = React.useMemo(()=>{const m={};Object.keys(dayBookings).forEach(k=>{const ri=k.split('__')[0];if(!m[ri])m[ri]=new Set();dayBookings[k].forEach(p=>m[ri].add(p));});return m;},[dayBookings]);

  const [seenResProjs,setSeenResProjs] = useState(()=>new Set(lsGet(LS_SEEN,[])));

      setTimeout(scrollToToday,0);
    }else{
      savedFiltersRef.current=filters;
      setFinderProjId(projId);
      setFilters(f=>({...f,projects:new Set([projId])}));
    }
  }
  useEffect(()=>{
    const pairs=new Set(Object.keys(bookings).map(k=>{const[r,p]=k.split('__');return r+'__'+p;}));
    if(!pairs.size)return;
    setSeenResProjs(prev=>{const toAdd=[...pairs].filter(pair=>!prev.has(pair));if(!toAdd.length)return prev;return new Set([...prev,...toAdd]);});
  },[bookings]);
  const [modal,setModal]         = useState(null);

  const [pendingDelete,setPendingDelete] = useState(null);

  function addPl(name){const n=name.trim();if(!n||pls.includes(n))return;setPls(p=>[...p,n].sort((a,b)=>a.localeCompare(b,'sv')));}
  function doRemovePl(name){setPls(p=>p.filter(x=>x!==name));toast_(`${name} borttagen`);}
  function removePl(name){setPendingDelete({type:'pl',id:name,name});}
  const [projects,setProjects]   = useState(()=>lsGet(LS_PROJ,INITIAL_PROJECTS));
  const scrollRef                = useRef(null);
  const todayColRef              = useRef(null);
  const importFileRef            = useRef(null);

  useEffect(()=>{

    document.body.style.overflow=open?'hidden':'';
    return()=>{document.body.style.overflow='';};
  },[modal,adminModal,showLegend,confirmRm,pendingDelete,ctxMenu,dayCtxMenu]);

  const todayMon = useMemo(()=>getMon(new Date()),[]);
  const weeks = useMemo(()=>{const ws=[];let w=addW(new Date(todayMon),-4);const end=addW(new Date(todayMon),52);while(w<=end){ws.push(new Date(w));w=addW(w,1);}return ws;},[todayMon]);
  const projMap = useMemo(()=>Object.fromEntries(projects.map(p=>[p.id,p])),[projects]);
  /* resTotalHrs[resId] = framåtvänd summa (aktuell vecka + framåt, ej historik) */
  const resTotalHrs = React.useMemo(()=>{const m={};const today=iso(todayMon);Object.keys(dayBookings).forEach(k=>{const[ri,d]=k.split('__');if(d>=today){m[ri]=(m[ri]||0)+dayBookings[k].length*8;}});return m;},[dayBookings,todayMon]);
  /* weekStats: precomputed hrs+over per resource per week — O(1) lookup in render instead of O(W×P) */
  const weekStats = useMemo(()=>{
    const h={},ov={};
    resources.forEach(res=>{h[res.id]={};ov[res.id]={};weeks.forEach(wm=>{const k=iso(wm);const hrs=bHrsWeek(bookings,res.id,wm,projects);h[res.id][k]=hrs;const cap=resCap(res,wm);const workHrs=wdays(wm).filter(d=>!isDayOff(d)).reduce((s,d)=>s+projects.filter(p=>isB(bookings,res.id,p.id,d)).length*8,0);ov[res.id][k]=(workHrs>cap||maxDayLoad(bookings,res.id,wm,projects)>1)&&hrs>0;});});
    return{h,ov};
  },[bookings,resources,projects,weeks]);
  /* resHrsByProj: framåtvänd summa per resurs/projekt (aktuell vecka + framåt) */
  const resHrsByProj = useMemo(()=>{const m={};const today=iso(todayMon);Object.keys(bookings).forEach(k=>{const[r,p,d]=k.split('__');if(d>=today){if(!m[r])m[r]={};m[r][p]=(m[r][p]||0)+8;}});return m;},[bookings,todayMon]);
  /* nonLedigProjs: stable reference, avoids re-filtering on every ddots cell */
  const nonLedigProjs = useMemo(()=>projects.filter(p=>p.id!=='LEDIG'),[projects]);

  function wkey(wm){return iso(wm);}
  function toggleExp(wm){const k=wkey(wm);setExpanded(p=>{const n=new Set(p);n.has(k)?n.delete(k):n.add(k);return n;});}
  function isExp(wm){return expanded.has(wkey(wm));}
  function toast_(m){setToast(m);setTimeout(()=>setToast(null),2200);}
  function setBookingsWithUndo(updater){setBookings(prev=>{const next=typeof updater==='function'?updater(prev):updater;undoStack.current=[...undoStack.current.slice(-29),prev];return next;});}
  function handleUndo(){if(undoStack.current.length>0){const prev=undoStack.current[undoStack.current.length-1];undoStack.current=undoStack.current.slice(0,-1);setBookings(prev);toast_('↩ Ångrat');}else{toast_('Inget att ångra');}}
  function logAudit(action,detail){const entry={ts:Date.now(),admin:adminName,action,detail};setAuditLog(prev=>{const next=[entry,...prev].slice(0,500);lsSet(LS_AUDIT,next);return next;});}
  function toggleHkQuick(r,p,mon){if(!isAdmin){toast_('Logga in som admin för att ändra');return;}const key=r+'__'+p+'__'+iso(mon);const cur=hosKund[key];setHosKund(prev=>{const n={...prev};cur?delete n[key]:(n[key]=true);return n;});logAudit(cur?'Hos kund borttaget':'Hos kund satt',`${resources.find(x=>x.id===r)?.name||r} → ${projMap[p]?.name||p} V${wnum(mon)}`);setCtxMenu(null);}
  function toggleHkDay(r,p,wm,d){if(!isAdmin){toast_('Logga in som admin för att ändra');return;}const key=r+'__'+p+'__'+iso(wm);const dayIso=iso(d);const cur=hosKund[key];setHosKund(prev=>{const n={...prev};if(!cur){n[key]=[dayIso];}else if(cur===true){const all=wdays(wm).filter(x=>!isDayOff(x)&&isB(bookings,r,p,x)).map(x=>iso(x));const nv=all.filter(x=>x!==dayIso);nv.length===0?delete n[key]:(n[key]=nv);}else if(Array.isArray(cur)){const nv=cur.includes(dayIso)?cur.filter(x=>x!==dayIso):[...cur,dayIso];nv.length===0?delete n[key]:(n[key]=nv);}return n;});logAudit('Dag Hos kund toggle',`${resources.find(x=>x.id===r)?.name||r} → ${projMap[p]?.name||p} ${dayIso}`);setDayCtxMenu(null);}
  function handleAdminLogin(name){setIsAdmin(true);setAdminName(name);setAdminModal(null);toast_(`✓ Inloggad som ${name}`);}
  function handleLogout(){setIsAdmin(false);setAdminName('');toast_('Utloggad');}

  function addAdminAcc(name,hash){const next=[...admins,{name,hash}];setAdmins(next);lsSet(LS_ADMINS,next);logAudit('Admin tillagd',name);toast_(`✓ ${name} tillagd`);}
  function removeAdminAcc(name){const next=admins.filter(a=>a.name!==name);setAdmins(next);lsSet(LS_ADMINS,next);logAudit('Admin borttagen',name);toast_(`${name} borttagen`);}
  function changeAdminPassword(name,hash){const next=admins.map(a=>a.name===name?{...a,hash}:a);setAdmins(next);lsSet(LS_ADMINS,next);logAudit('Lösenord ändrat',name);toast_('✓ Lösenord ändrat');}

  function computeTodayScroll(){const todayIdx=weeks.findIndex(wm=>wm.getTime()===todayMon.getTime());if(todayIdx<0)return 0;let sl=0;for(let i=0;i<todayIdx;i++){sl+=isExp(weeks[i])?workDays(weeks[i]).length*26:52;}return sl;}
  function scrollToToday(){const todayIdx=weeks.findIndex(wm=>wm.getTime()===todayMon.getTime());if(todayIdx<0)return;let sl=0;for(let i=0;i<todayIdx;i++){sl+=isExp(weeks[i])?workDays(weeks[i]).length*26:52;}if(scrollRef.current)scrollRef.current.scrollLeft=sl;document.querySelectorAll('.pv-scroll').forEach(c=>{c.scrollLeft=sl;});}
  function goToToday(){setExpanded(new Set());setTimeout(scrollToToday,50);}
  useEffect(()=>{setTimeout(scrollToToday,300);},[]);

  useEffect(()=>{
    function onKey(e){
      if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();handleUndo();}
      if(e.key==='Escape'){setModal(null);setConfirmRm(null);setPendingDelete(null);setSwapBehovModal(null);setShowLegend(false);setAdminModal(null);setCtxMenu(null);setDayCtxMenu(null);}
    }
    document.addEventListener('keydown',onKey);
    return()=>document.removeEventListener('keydown',onKey);
  },[]);
  /* ── Draggable modals ── */
  useEffect(()=>{
    let drag=null;
    function onDown(e){
      const title=e.target.closest('.modal-title');
      if(!title)return;
      const modal=title.closest('.modal');
      if(!modal)return;
      const mat=new DOMMatrix(getComputedStyle(modal).transform);
      drag={modal,ox:e.clientX-mat.m41,oy:e.clientY-mat.m42};
      modal.style.transition='none';
    }
    function onMove(e){
      if(!drag)return;
      drag.modal.style.transform=`translate(${e.clientX-drag.ox}px,${e.clientY-drag.oy}px)`;
    }
    function onUp(){drag=null;}
    document.addEventListener('mousedown',onDown);
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
    return()=>{document.removeEventListener('mousedown',onDown);window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);};

  const [isAdmin,setIsAdmin]               = useState(false);
  const [adminName,setAdminName]           = useState('');
  const [admins,setAdmins]                 = useState(()=>lsGet(LS_ADMINS,[]));
  const [auditLog,setAuditLog]             = useState(()=>lsGet(LS_AUDIT,[]));
  const [adminModal,setAdminModal]         = useState(null);
  const [behovItems,setBehovItems] = useState(()=>lsGet(LS_BEHOV,[]));
  useEffect(()=>{const t=setTimeout(()=>{lsSet(LS_BK,bookings);lsSet(LS_VER,DATA_VERSION);},600);return()=>clearTimeout(t);},[bookings]);
  useEffect(()=>{lsSet(LS_RES,resources);},[resources]);
  useEffect(()=>{lsSet(LS_PROJ,projects);},[projects]);
  useEffect(()=>{lsSet(LS_PLS,pls);},[pls]);
  useEffect(()=>{lsSet(LS_HK,hosKund);},[hosKund]);

  function toggleDay(r,p,d){if(!isAdmin){toast_('Logga in som admin för att ändra beläggning');return;}const res=resources.find(x=>x.id===r);const alreadyBooked=!!bookings[bk(r,p,d)];if(isDayOff(d)&&!alreadyBooked)return;if(!consultAvail(res,d)){toast_('Utanför konsultens bokningsperiod');return;}const k=bk(r,p,d);logAudit(!!bookings[k]?'Dag borttagen':'Dag bokad',`${res?.name||r} → ${projMap[p]?.name||p} ${d}`);setBookingsWithUndo(prev=>{const n={...prev};n[k]?delete n[k]:(n[k]=true);return n;});}
  function toggleWeek(r,p,mon){if(!isAdmin){toast_('Logga in som admin för att ändra beläggning');return;}const res=resources.find(x=>x.id===r);const isLedig=p==='LEDIG';const fixedDays=res?.partTime?.fixedDays;const days=(!isLedig&&fixedDays?.length)?wdays(mon).filter((d,i)=>!isDayOff(d)&&fixedDays.includes(i)&&consultAvail(res,d)):wdays(mon).filter(d=>!isDayOff(d)&&(isLedig||consultAvail(res,d)));const any=days.some(d=>isB(bookings,r,p,d));if(!any&&res?.type==='konsult'&&!days.length){toast_('Utanför konsultens bokningsperiod');return;}logAudit(any?'Vecka borttagen':'Vecka bokad',`${res?.name||r} → ${projMap[p]?.name||p} ${iso(mon)}`);setBookingsWithUndo(prev=>{const n={...prev};days.forEach(d=>{const k=bk(r,p,d);any?delete n[k]:(n[k]=true);});return n;});toast_(any?'Bokning borttagen':'✓ Vecka bokad');}
  function applyModal(r,p,mon,sel,hk){const _res=resources.find(x=>x.id===r);logAudit('Bokning sparad',`${_res?.name||r} → ${projMap[p]?.name||p} ${iso(mon)}`);setBookingsWithUndo(prev=>{const n={...prev};wdays(mon).forEach((d,i)=>{const k=bk(r,p,d);if(sel[i]&&_res?.type==='konsult'&&!isDayOff(d)&&!consultAvail(_res,d)){delete n[k];return;}sel[i]?(n[k]=true):delete n[k];});return n;});const hkk=r+'__'+p+'__'+iso(mon);setHosKund(prev=>{const n={...prev};(!hk||hk===false)?delete n[hkk]:(n[hkk]=hk);return n;});toast_('✓ Bokning sparad');setModal(null);}
  function applyMultiModal(r,p,mons,sel){logAudit('Flersveckorsbokning',`${resources.find(x=>x.id===r)?.name||r} → ${projMap[p]?.name||p} (${mons.length} veckor)`);setBookingsWithUndo(prev=>{const n={...prev};mons.forEach(mon=>{wdays(mon).forEach((d,i)=>{const k=bk(r,p,d);if(isDayOff(d)){delete n[k];return;}sel[i]?(n[k]=true):delete n[k];});});return n;});toast_(`✓ ${mons.length} ${mons.length===1?'vecka':'veckor'} bokade`);setModal(null);}
  function deleteModal(r,p,mon){logAudit('Bokning raderad',`${resources.find(x=>x.id===r)?.name||r} → ${projMap[p]?.name||p} ${iso(mon)}`);setBookingsWithUndo(prev=>{const n={...prev};wdays(mon).forEach(d=>delete n[bk(r,p,d)]);return n;});const hkk=r+'__'+p+'__'+iso(mon);setHosKund(prev=>{const n={...prev};delete n[hkk];return n;});toast_('Bokning borttagen');setModal(null);}
  function openModal(r,p,mon){if(!isAdmin){toast_('Logga in som admin för att ändra beläggning');return;}const _res2=resources.find(x=>x.id===r);const fixedDays2=_res2?.partTime?.fixedDays;const isLedig2=p==='LEDIG';const existDays=wdays(mon).map(d=>isB(bookings,r,p,d));const anyBooked2=existDays.some(Boolean);const defaultDays=anyBooked2?existDays:wdays(mon).map((d,i)=>!isDayOff(d)&&(!isLedig2&&fixedDays2?.length?fixedDays2.includes(i):isB(bookings,r,p,d)));const bld=wdays(mon).map(d=>resBlockedDay(dayBookings,r,p,d));const hkk=r+'__'+p+'__'+iso(mon);const ptFixed=(!isLedig2&&fixedDays2?.length>0&&fixedDays2.length<5)?fixedDays2:null;setModal({r,p,mon,days:defaultDays,blocked:bld,hosKundVal:hosKund[hkk]||false,ptFixedDays:ptFixed});}
  function fmtTs(ts){const d=new Date(ts);return`${d.getDate()} ${['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'][d.getMonth()]} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;}
  function exportBackup(){
    const snap={bookings,resources,projects,pls,ts:Date.now(),v:DATA_VERSION};
    const blob=new Blob([JSON.stringify(snap,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const d=new Date();
    a.href=url;a.download=`3bg-backup-${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}.json`;
    a.click();URL.revokeObjectURL(url);
    toast_('✓ Backup exporterad till fil');
  }
  function handleImportFile(e){
    const file=e.target.files[0];if(!file)return;
    e.target.value='';
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const snap=JSON.parse(ev.target.result);
        if(!snap.bookings||!snap.resources||!snap.projects)throw new Error('Ogiltig fil');
        const bkFmt=snap.ts?fmtTs(snap.ts):'okänt datum';
        setModal({type:'backupImport',snap,bkFmt});
      }catch{toast_('⚠ Kunde inte läsa filen — kontrollera att det är en 3BG-backupfil');}
    };
    reader.readAsText(file);
  }
  function saveBackup(){
    const snap={bookings,resources,projects,pls,ts:Date.now(),v:DATA_VERSION};
    lsSet(LS_BACKUP,snap);
    toast_(`✓ Backup sparad ${fmtTs(snap.ts)}`);
  }
  function restoreBackup(snap){
    undoStack.current=[];
    setBookings(snap.bookings);setResources(snap.resources);setProjects(snap.projects);setPls(snap.pls);
    lsSet(LS_BK,snap.bookings);lsSet(LS_RES,snap.resources);lsSet(LS_PROJ,snap.projects);lsSet(LS_PLS,snap.pls);lsSet(LS_VER,DATA_VERSION);
    logAudit('Backup återställd','');
    toast_('✓ Backup återskapad');
  }
  function clearBookingsForPair(r,p){logAudit('Bokningar rensade',`${resources.find(x=>x.id===r)?.name||r}: ${p}`);setBookingsWithUndo(prev=>{const n={...prev};Object.keys(n).forEach(k=>{const[a,b]=k.split('__');if(a===r&&b===p)delete n[k];});return n;});toast_('Bokningar borttagna');}
  function rmProjFromRes(r,p){logAudit('Projekt borttaget från resurs',`${resources.find(x=>x.id===r)?.name||r}: ${p}`);setSeenResProjs(prev=>{const n=new Set(prev);n.delete(r+'__'+p);return n;});toast_('Projekt borttaget');}
  function addResource(name,role,type,company,periodStart,periodEnd,partTime){const id='r'+Date.now();const pt=name.trim().split(/\s+/);const ini=((pt[0]?.[0]||'')+(pt[1]?.[0]||'')).toUpperCase();const res={id,name:name.trim(),role:role.trim(),initials:ini,active:true,type:type||'ordinarie'};if(type==='konsult'){res.company=company||'';res.periodStart=periodStart||'';res.periodEnd=periodEnd||'';}if(partTime)res.partTime=partTime;setResources(p=>[...p,res]);logAudit('Resurs tillagd',name.trim());toast_(`✓ ${name.trim()} tillagd`);}
  function doRemoveResource(id){const res=resources.find(r=>r.id===id);logAudit('Resurs borttagen',res?.name||id);setResources(p=>p.filter(r=>r.id!==id));setBookings(p=>{const n={...p};Object.keys(n).forEach(k=>{if(k.startsWith(id+'__'))delete n[k];});return n;});setSeenResProjs(prev=>new Set([...prev].filter(pair=>!pair.startsWith(id+'__'))));toast_(`${res?.name||'Resurs'} borttagen`);}
  function removeResource(id){const res=resources.find(r=>r.id===id);const hasB=Object.keys(bookings).some(k=>k.startsWith(id+'__'));setPendingDelete({type:'res',id,name:res?.name||'Resurs',hasBookings:hasB});}
  function updateResource(id,changes){logAudit('Resurs uppdaterad',resources.find(r=>r.id===id)?.name||id);setResources(p=>p.map(r=>r.id===id?{...r,...changes}:r));toast_('✓ Sparad');}
  function addProject(id,name,pl,fat,sat){if(!id||projects.some(p=>p.id===id)){toast_('Projektet finns redan');return;}const proj={id,name:name||id,pl:pl||'-'};if(fat||sat)proj.milestones={fat:fat||null,sat:sat||null};setProjects(p=>[...p,proj]);logAudit('Projekt tillagd',`${id} — ${name||id}`);toast_(`✓ ${id} tillagd`);}
  function doRemoveProject(id){logAudit('Projekt borttaget',id);setProjects(ps=>ps.filter(p=>p.id!==id));setBookings(prev=>{const n={...prev};Object.keys(n).forEach(k=>{if(k.split('__')[1]===id)delete n[k];});return n;});setSeenResProjs(prev=>{const n=new Set([...prev].filter(pair=>pair.split('__')[1]!==id));return n;});toast_(`${id} borttagen`);}
  function removeProject(id){const hasB=Object.keys(bookings).some(k=>k.split('__')[1]===id);setPendingDelete({type:'proj',id,hasBookings:hasB});}
  function renameProject(oldId,newId,newName){
    if(!newId.trim()){toast_('Projektkod får inte vara tom');return;}
    if(newId!==oldId&&projects.some(p=>p.id===newId)){toast_('Projektkod finns redan');return;}
    logAudit('Projekt omdöpt',`${oldId} → ${newId.trim()}`);
    setProjects(ps=>ps.map(p=>p.id===oldId?{...p,id:newId.trim(),name:newName.trim()||newId.trim()}:p));
    if(newId!==oldId){setBookings(prev=>{const n={};Object.keys(prev).forEach(k=>{const[r,p,d]=k.split('__');n[p===oldId?`${r}__${newId.trim()}__${d}`:k]=prev[k];});return n;});}
    toast_(`✓ ${oldId} → ${newId.trim()}`);
  }
  function updateProjectMilestones(id,fat,sat){
    setProjects(ps=>ps.map(p=>{if(p.id!==id)return p;const ms={fat:fat||null,sat:sat||null};return(ms.fat||ms.sat)?{...p,milestones:ms}:{...p,milestones:undefined};}));
    logAudit('Milstolpar uppdaterade',id);
    toast_('✓ Milstolpar sparade');
  }
  function updateProjectPl(id,pl){
    setProjects(ps=>ps.map(p=>p.id===id?{...p,pl:pl||'-'}:p));

    toast_('✓ Projektledare sparad');
  }

  function createBehov(kompetens,projectId,weeks,qty){logAudit('Behovsresurs skapad',`${qty}× ${kompetens} → ${projectId}`);const items=Array.from({length:qty},(_,i)=>({id:'bh_'+Date.now()+'_'+i,kompetens,projectId,weeks,createdAt:Date.now()}));setBehovItems(prev=>[...prev,...items]);toast_(`✓ ${qty>1?qty+' behovsresurser':'Behovsresurs'} skapad`);}

  function swapBehov(behovId,realResId){const bh=behovItems.find(b=>b.id===behovId);if(!bh)return;const resN=resources.find(r=>r.id===realResId)?.name||realResId;logAudit('Behov tilldelat',`${bh.kompetens} → ${resN}`);setBookingsWithUndo(prev=>{const n={...prev};bh.weeks.forEach(mon=>{workDays(new Date(mon+'T12:00:00')).forEach(({d})=>{if(!isDayOff(d))n[bk(realResId,bh.projectId,d)]=true;});});return n;});setBehovItems(prev=>prev.filter(b=>b.id!==behovId));toast_('✓ Behov tilldelat');setSwapBehovModal(null);}
  const lastWm=weeks[weeks.length-1];
  const shared={weeks,bookings,hosKund,dayBookings,resProjs,resTotalHrs,weekStats,resHrsByProj,nonLedigProjs,todayMon,projMap,isExp,toggleExp,toggleDay,toggleWeek,openModal,filters,resources,projects,scrollRef,todayColRef,
    onAddForRes:(r)=>setModal({isNew:true,preRes:r}),

    behovItems,

    onCtxMenu:(r,p,mon,x,y)=>setCtxMenu({r,p,mon,x,y}),
    onDayCtxMenu:(r,p,wm,d,x,y)=>setDayCtxMenu({r,p,wm,d,x,y}),

            <polygon points="692.4 88.7 995 88.7 995 266 906.4 266 906.4 177.3 640.3 177.3 640.3 266 906.4 266 906.4 354.6 640.3 354.6 640.3 443.2 906.4 443.2 906.4 354.6 995 354.6 995 390.1 853.2 531.9 551.7 531.9 551.7 230.5 692.4 88.7"/>
            <rect x="266" y="266" width="177.4" height="88.6"/>
            <polygon points="390 531.9 88.7 531.9 88.7 354.6 177.3 354.6 177.3 443.2 443.2 443.2 443.2 354.6 531.9 354.6 531.9 390.1 390 531.9"/>
            <polygon points="229.4 88.7 531.9 88.7 531.9 266 443.2 266 443.2 177.3 177.3 177.3 177.3 266 88.7 266 88.7 230.5 229.4 88.7"/>

function MultiSelect({ph,opts,sel,onChange}){
  const [open,setOpen]=useState(false);const ref=useRef(null);
  useEffect(()=>{function h(e){if(ref.current&&!ref.current.contains(e.target))setOpen(false);}document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);},[]);
  const c=sel.size;
  return(<div ref={ref} className="ms-wrap">
    <button className={`ms-btn${c>0?' active':''}`} onClick={()=>setOpen(o=>!o)}>{c>0?`${ph} (${c})`:ph}<span style={{fontSize:8,opacity:.5,marginLeft:2}}>▼</span></button>
    {open&&<div className="ms-drop">{opts.length===0&&<div style={{padding:'10px 14px',fontSize:12,color:'#adb5bd'}}>Inga alternativ</div>}{opts.map(o=>{const ck=sel.has(o.v);return(<label key={o.v} className={`ms-item${ck?' checked':''}`}><input type="checkbox" className="ms-cb" checked={ck} onChange={()=>{const n=new Set(sel);ck?n.delete(o.v):n.add(o.v);onChange(n);}}/>{o.l}</label>);})}</div>}
  </div>);
}

function FilterBar({view,filters,onChange,resources,projects,bookings,pls}){
  const has=filters.search||filters.persons.size>0||filters.projects.size>0||filters.pls.size>0||filters.roles.size>0;
  const resOpts=useMemo(()=>[...resources.filter(r=>r.active)].sort((a,b)=>{const ak=a.type==='konsult'?1:0,bk=b.type==='konsult'?1:0;return ak!==bk?ak-bk:a.name.localeCompare(b.name,'sv');}).map(r=>({v:r.id,l:r.name})),[resources]);
  const projOpts=useMemo(()=>{
    const bookedIds=new Set(Object.keys(bookings||{}).map(k=>k.split('__')[1]));
    return sortProjs(projects.filter(p=>bookedIds.has(p.id))).map(p=>({v:p.id,l:p.name!==p.id?`${p.id} — ${p.name}`:p.id}));
  },[projects,bookings]);
  const plOpts=useMemo(()=>{
    const bookedIds=new Set(Object.keys(bookings||{}).map(k=>k.split('__')[1]));
    const activeProjsWithPl=projects.filter(p=>bookedIds.has(p.id));
    // Namngivna PLs — lös upp initialer till fullständiga namn, deduplicera, sortera alfabetiskt
    const plsMap=new Map(); // resolved name → raw pl value (för korrekt filterjämförelse via plName())
    activeProjsWithPl.filter(p=>p.pl&&p.pl!=='-'&&p.pl!=='N/A').forEach(p=>{
      const resolved=plName(p.pl);
      if(!plsMap.has(resolved))plsMap.set(resolved,p.pl);
    });
    const named=[...plsMap.entries()].sort((a,b)=>a[0].localeCompare(b[0],'sv')).map(([l,v])=>({v,l}));
    // Specialvärden sist — bara om minst ett bokat projekt har dem
    const hasIngen=activeProjsWithPl.some(p=>!p.pl||p.pl==='-');
    const hasNA=activeProjsWithPl.some(p=>p.pl==='N/A');
    return[...named,...(hasIngen?[{v:'-',l:'Ingen tillsatt'}]:[]),...(hasNA?[{v:'N/A',l:'N/A'}]:[])];
  },[projects,bookings]);
  return(
    <div className="filter-bar">
      <div className="fsearch"><span style={{fontSize:13,color:'#adb5bd'}}>🔍</span><input placeholder={view==='resource'?'Sök person…':'Sök projekt…'} value={filters.search} onChange={e=>onChange({...filters,search:e.target.value})}/></div>
      {view==='resource'&&<MultiSelect ph="Resurser" opts={resOpts} sel={filters.persons} onChange={s=>onChange({...filters,persons:s})}/> }
      {view==='resource'&&([...COMPETENCIES,'Konsult'].map(c=>{const active=filters.roles.has(c);return<button key={c} onClick={()=>{const n=new Set(filters.roles);active?n.delete(c):n.add(c);onChange({...filters,roles:n});}} style={{padding:'4px 10px',borderRadius:6,border:'1.5px solid',borderColor:active?'#1a1a2e':'#dee2e6',background:active?'#1a1a2e':'white',color:active?'white':'#495057',fontSize:12,fontWeight:active?600:400,cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>{c}</button>;}))}

      {view==='project'&&<MultiSelect ph="Projekt" opts={projOpts} sel={filters.projects} onChange={s=>onChange({...filters,projects:s})}/>}
      {view==='project'&&plOpts.length>0&&<MultiSelect ph="Projektledare" opts={plOpts} sel={filters.pls} onChange={s=>onChange({...filters,pls:s})}/>}
      {has&&<button className="fclear" onClick={()=>onChange({search:'',persons:new Set(),projects:new Set(),pls:new Set(),roles:new Set()})}>✕ Rensa</button>}
    </div>
  );
}

/* WeekTh — renders one <th> for a week; colSpan=wd.length when expanded */
function WeekTh({wm,prevWm,todayMon,isExpFn,onToggle,todayColRef,milestoneLabel}){
  const exp=isExpFn(wm);
  const isCur=wm.getTime()===todayMon.getTime();
  const wd=wdays(wm);
  const sh=isShortWeek(wm);
  const isPast=wm<todayMon;
  const isYearStart=isCur||(!isPast&&prevWm&&wm.getFullYear()!==prevWm.getFullYear());
  const msColor=milestoneLabel==='FAT'?'#3b82f6':milestoneLabel==='SAT'?'#e63946':null;
  const cls=`th-week${isYearStart?' year-start':''}${isPast?' is-past':''}`;
  if(exp){
    return(
      <th className={cls} colSpan={wd.length} ref={isCur?todayColRef:null} style={msColor?{borderTop:`3px solid ${msColor}`}:undefined}>
        <div className="th-week-inner-exp" onClick={()=>onToggle(wm)}>
          <div>
            {milestoneLabel&&<span className={`ms-badge ms-${milestoneLabel.toLowerCase()}`}>{milestoneLabel}</span>}
            {isYearStart&&<span className="wk-year-badge">{wm.getFullYear()}</span>}
            <span className={`wk-num${isCur?' today':''}`}>V{wnum(wm)}{sh&&<span className="wk-star">★</span>}</span>
            <span className="wk-date">{fmt(wm)} – {fmt(addD(wm,4))}</span>
          </div>
          <span className="exp-icon open">▶</span>
        </div>
      </th>
    );
  }
  return(
    <th className={cls} rowSpan={2} ref={isCur?todayColRef:null} style={msColor?{borderTop:`3px solid ${msColor}`}:undefined}>
      <div className="th-week-inner" onClick={()=>onToggle(wm)}>
        {milestoneLabel&&<span className={`ms-badge ms-${milestoneLabel.toLowerCase()}`}>{milestoneLabel}</span>}
        {isYearStart&&<span className="wk-year-badge">{wm.getFullYear()}</span>}
        <span className={`wk-num${isCur?' today':''}`}>V{wnum(wm)}{sh&&<span className="wk-star">★</span>}</span>
        <span className="wk-date">{fmt(wm)}</span>
        <span className="exp-icon">▶</span>
      </div>
    </th>
  );
}

                            :<div className="proj-sc" style={{paddingLeft:8}}>

                                <div className="proj-sc-id" style={{flex:1,minWidth:0,display:'flex',alignItems:'center',flexWrap:'nowrap',overflow:'hidden'}}>
                                  <div className="pjdot" style={{flexShrink:0}}/>
                                  <span className="pjcode" style={{flexShrink:0}}>{proj.id}</span>
                                  {displayName&&displayName!==proj.id&&<span className="pjname">{displayName}</span>}
                                </div>
                                <div className="proj-sc-right">
                                  {isAdmin&&<button className="proj-rm-btn" title="Ta bort" onClick={()=>onConfirmRm(res.id,proj.id,res.name,displayName,!!resProjs[res.id]?.has(proj.id))}>−</button>}
                                </div>
                              </div>
                            </div>
                          }
                        </td>
                        <td className="c-proj">{!isLedig&&<div style={{padding:'4px 8px',fontSize:12,fontWeight:700,color:totalHrs>0?'#374151':'#adb5bd',textAlign:'center'}}>{totalHrs>0?`${totalHrs}h`:'—'}</div>}</td>
                        {weeks.map((wm)=>{
                          const isPast=wm<todayMon;
                          if(isExp(wm)){
                            const wd5=wdays(wm);
                            return wd5.map((d,di)=>{
                              const isOff=isDayOff(d);
                              const booked=isB(bookings,res.id,proj.id,d);
                              const outsidePeriod=res.type==='konsult'&&!consultAvail(res,d);
                              const isPtOff=!isOff&&res.partTime?.fixedDays?.length>0&&!res.partTime.fixedDays.includes(di);
                              return(
                                <td key={`${iso(wm)}-d${di}`} className={`td-day${di===4?' td-day-last':''}${isPast?' is-past':''}${outsidePeriod?' konsult-outside':''}`} title={outsidePeriod?'Utanför konsultperiod':undefined} onClick={!outsidePeriod&&(booked||(!isOff&&!isPtOff&&!resBlockedDay(dayBookings,res.id,proj.id,d)))?(()=>toggleDay(res.id,proj.id,d)):undefined}>
                                  {outsidePeriod?<div className="dchip-outside"/>:(booked?<div className={`dchip${isLedig?' red':isHkForDay(hosKund,res.id,proj.id,wm,d)?' hk':''}`} onContextMenu={isAdmin?(e)=>{e.preventDefault();e.stopPropagation();onDayCtxMenu(res.id,proj.id,wm,d,e.clientX,e.clientY);}:undefined}>8h</div>:isOff?<div className={`dchip-h${isAdmin?' clickable':''}`} title="Röd dag / ATF" onClick={isAdmin?(e)=>{e.stopPropagation();openModal(res.id,proj.id,wm);}:undefined}>✕</div>:isPtOff?<div className={`dchip-h${isAdmin?' clickable':''}`} title={`${res.name} arbetar normalt inte denna dag — klicka för att boka ändå`} onClick={isAdmin?(e)=>{e.stopPropagation();openModal(res.id,proj.id,wm);}:undefined}>✕</div>:resBlockedDay(dayBookings,res.id,proj.id,d)?<div className="dchip-off" title="Belagd på annat projekt"/>:<div className="dchip-e"/>)}
                                </td>
                              );
                            });
                          }
                          const bd=bdaysOf(bookings,res.id,proj.id,wm);
                          const hkVal_rv=!isLedig?hosKund[res.id+'__'+proj.id+'__'+iso(wm)]:null;
                          const isHk=!!hkVal_rv;
                          const isHkPartial=isHk&&Array.isArray(hkVal_rv)&&hkVal_rv.length<bd.length;
                          const periodDays=res.type==='konsult'?workDays(wm).filter(({d})=>consultAvail(res,d)):workDays(wm);
                          const allOutsidePeriod=res.type==='konsult'&&periodDays.length===0;
                          return(
                            <td key={iso(wm)} className={`td-week${isPast?' is-past':''}${allOutsidePeriod?' konsult-outside':''}`} title={allOutsidePeriod?'Utanför konsultperiod':undefined} style={{padding:allOutsidePeriod?3:undefined}}
                              onClick={isPast?undefined:allOutsidePeriod?undefined:bd.length?(()=>openModal(res.id,proj.id,wm)):(()=>{const free=periodDays.filter(({d})=>!resBlockedDay(dayBookings,res.id,proj.id,d));if(free.length===0)return;free.length<workDays(wm).length?openModal(res.id,proj.id,wm):toggleWeek(res.id,proj.id,wm);})}
                              onContextMenu={!isPast&&!allOutsidePeriod&&bd.length?((e)=>{e.preventDefault();onCtxMenu(res.id,proj.id,wm,e.clientX,e.clientY);}):undefined}>
                              {allOutsidePeriod?<div className="wchip-outside"/>:(bd.length?<div className={`wchip${isLedig?' red':isHk?' hk':''}`} title={displayName} style={{position:'relative'}}>{bd.length*8}h{isHkPartial&&<span style={{position:'absolute',top:1,right:2,fontSize:7,lineHeight:1,color:'white',opacity:.9}}>★</span>}</div>:(()=>{const free=periodDays.filter(({d})=>!resBlockedDay(dayBookings,res.id,proj.id,d));return free.length===0?<div className="wchip-off" title="Resursen är fullbelagd denna vecka"/>:<div className="wchip-e"/>;})())}
                            </td>
                          );
                        })}
                      </tr>
                    );
                  })}
                </React.Fragment>);
              });
              return rows;
            })()}
          </tbody>
        </table>
      </div>
    </div>
  );
});

/* ════════════ MOBILVY ════════════ */
function MobileApp({resources,bookings,hosKund,dayBookings,resProjs,projMap,nonLedigProjs,todayMon,weeks,projects}){
  const [tab,setTab]=useState('resurs');
  const [wIdx,setWIdx]=useState(()=>{const i=weeks.findIndex(wm=>wm.getTime()===todayMon.getTime());return i>=0?i:0;});
  const wm=weeks[wIdx]||todayMon;
  const isPast=wm<todayMon;
  const isCur=wm.getTime()===todayMon.getTime();
  const wd=wdays(wm);
  function prev(){setWIdx(i=>Math.max(0,i-1));}
  function next(){setWIdx(i=>Math.min(weeks.length-1,i+1));}
  const logoSVG=<svg viewBox="80 80 1390 460" aria-label="3BG"><polygon points="1459.3 390.1 1459.3 266 1193.3 266 1193.3 354.6 1370.6 354.6 1370.6 443.2 1104.4 443.2 1104.4 177.3 1459.3 177.3 1459.3 88.7 1156.5 88.7 1015.8 230.5 1015.8 531.9 1317.4 531.9 1459.3 390.1"/><polygon points="692.4 88.7 995 88.7 995 266 906.4 266 906.4 177.3 640.3 177.3 640.3 266 906.4 266 906.4 354.6 640.3 354.6 640.3 443.2 906.4 443.2 906.4 354.6 995 354.6 995 390.1 853.2 531.9 551.7 531.9 551.7 230.5 692.4 88.7"/><rect x="266" y="266" width="177.4" height="88.6"/><polygon points="390 531.9 88.7 531.9 88.7 354.6 177.3 354.6 177.3 443.2 443.2 443.2 443.2 354.6 531.9 354.6 531.9 390.1 390 531.9"/><polygon points="229.4 88.7 531.9 88.7 531.9 266 443.2 266 443.2 177.3 177.3 177.3 177.3 266 88.7 266 88.7 230.5 229.4 88.7"/></svg>;
  return(
    <div className="mob-wrap">
      <div className="mob-header">{logoSVG}<span className="mob-header-title">Resursplanering</span></div>
      <div className="mob-tabs">
        <button className={'mob-tab'+(tab==='resurs'?' active':'')} onClick={()=>setTab('resurs')}>👤 Resurser</button>
        <button className={'mob-tab'+(tab==='projekt'?' active':'')} onClick={()=>setTab('projekt')}>📁 Projekt</button>
      </div>
      <div className="mob-week-nav">
        <button onClick={prev} disabled={wIdx===0}>‹</button>
        <div className="mob-week-label">
          <div className={'mob-week-num'+(isCur?' '+'':'')} style={isCur?{color:'#e63946'}:{}}>{isCur?'▸ ':''}V{wnum(wm)} {wm.getFullYear()}</div>
          <div className="mob-week-date">{fmt(wd[0])} – {fmt(wd[wd.length-1])}{isPast?' · Passerad':''}</div>
        </div>
        <button onClick={next} disabled={wIdx===weeks.length-1}>›</button>
      </div>
      {tab==='resurs'
        ?<MobileResursvy resources={resources} bookings={bookings} hosKund={hosKund} dayBookings={dayBookings} resProjs={resProjs} projMap={projMap} nonLedigProjs={nonLedigProjs} todayMon={todayMon} weeks={weeks} wIdx={wIdx} wm={wm}/>
        :<MobileProjektvy projects={projects} resources={resources} bookings={bookings} hosKund={hosKund} resProjs={resProjs} projMap={projMap} todayMon={todayMon} weeks={weeks} wIdx={wIdx} wm={wm}/>
      }
    </div>
  );
}

function MobileResursvy({resources,bookings,hosKund,dayBookings,resProjs,projMap,nonLedigProjs,todayMon,weeks,wIdx,wm}){
  const [expanded,setExpanded]=useState(new Set());
  const [search,setSearch]=useState('');
  const aktiva=resources.filter(r=>r.active&&r.type!=='behov').sort((a,b)=>{
    const grp=r=>r.type==='konsult'?2:roleToArr(r.role||'').includes('Service')?1:0;
    return grp(a)!==grp(b)?grp(a)-grp(b):a.name.localeCompare(b.name,'sv');
  });
  const filtered=search?aktiva.filter(r=>r.name.toLowerCase().includes(search.toLowerCase())||r.role.toLowerCase().includes(search.toLowerCase())):aktiva;
  function tog(id){setExpanded(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});}
  const wd5=wdays(wm);
  const futureWeeks=weeks.slice(wIdx,wIdx+8);
  return(
    <div className="mob-content">
      <div className="mob-search" style={{margin:'0 0 10px'}}>
        <span style={{fontSize:14,color:'#adb5bd'}}>🔍</span>
        <input placeholder="Sök person…" value={search} onChange={e=>setSearch(e.target.value)}/>
        {search&&<button onClick={()=>setSearch('')} style={{border:'none',background:'none',color:'#9ca3af',fontSize:16,cursor:'pointer',padding:'0 2px'}}>✕</button>}
      </div>
      {filtered.map(res=>{
        const isExp=expanded.has(res.id);
        const dots=wd5.map((d,di)=>{
          if(isDayOff(d))return'off';
          if(res.type==='konsult'&&!consultAvail(res,d))return'off';
          if(res.partTime?.fixedDays?.length>0&&!res.partTime.fixedDays.includes(di))return'off';
          const led=isB(bookings,res.id,'LEDIG',d);
          if(led)return'led';
          const booked=nonLedigProjs.some(p=>isB(bookings,res.id,p.id,d));
          if(booked){const hk=isHkForDay(hosKund,res.id,nonLedigProjs.find(p=>isB(bookings,res.id,p.id,d))?.id||'',wm,d);return hk?'hk':'on';}
          return'free';
        });
        return(
          <div key={res.id} className="mob-card">
            <div className="mob-card-head" onClick={()=>tog(res.id)}>
              <div className="mob-av" style={res.type==='konsult'?{background:'#7c3aed'}:{}}>{res.initials}</div>
              <div>
                <div className="mob-name">{res.name}{res.type==='konsult'&&<span style={{marginLeft:5,fontSize:9,fontWeight:700,background:'#7c3aed',color:'white',borderRadius:3,padding:'1px 4px'}}>KONSULT</span>}</div>
                <div className="mob-role">{res.type==='konsult'?res.company||res.role:res.role||'—'}</div>
              </div>
              <div className="mob-dots">
                {dots.map((t,i)=><div key={i} className={'mob-dot'+(t==='on'?' on':t==='led'?' led':t==='hk'?' hk':t==='off'?' off':'')}/>)}
              </div>
              <span style={{marginLeft:6,fontSize:14,color:'#9ca3af'}}>{isExp?'▲':'▼'}</span>
            </div>
            {isExp&&(
              <div className="mob-weeks">
                {futureWeeks.map((fw,fi)=>{
                  const fwd=wdays(fw);
                  const isCurW=fw.getTime()===todayMon.getTime();
                  const projs=nonLedigProjs.filter(p=>bdaysOf(bookings,res.id,p.id,fw).length>0);
                  const ledHrs=bdaysOf(bookings,res.id,'LEDIG',fw).length*8;
                  return(
                    <div key={iso(fw)} className="mob-week-row" style={isCurW?{background:'#fff8f8'}:{}}>
                      <div className={'mob-week-tag'+(isCurW?' today':'')}>V{wnum(fw)}</div>
                      <div className="mob-chips">
                        {ledHrs>0&&<span className="mob-chip red">Ledig {ledHrs}h</span>}
                        {projs.map(p=>{const hrs=bdaysOf(bookings,res.id,p.id,fw).length*8;const hkV=hosKund[res.id+'__'+p.id+'__'+iso(fw)];return<span key={p.id} className={'mob-chip'+(hkV?' hk':'')}>{p.id} {hrs}h</span>;})}
                        {!ledHrs&&projs.length===0&&<span className="mob-free">Ledig</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
      {filtered.length===0&&<div className="mob-empty">Inga resurser matchar</div>}
    </div>
  );
}

function MobileProjektvy({projects,resources,bookings,hosKund,resProjs,projMap,todayMon,weeks,wIdx,wm}){
  const [search,setSearch]=useState('');
  const [selId,setSelId]=useState('');
  const activeProjs=sortProjs(projects.filter(p=>p.id!=='LEDIG'&&p.id!=='INTERN'&&p.id!=='TILLGÄNGLIG'&&resources.some(r=>resProjs[r.id]?.has(p.id))));
  const filtered=search?activeProjs.filter(p=>(p.id+p.name).toLowerCase().includes(search.toLowerCase())):activeProjs;
  const selProj=projMap[selId];
  const bookedRes=selId?resources.filter(r=>r.active&&bdaysOf(bookings,r.id,selId,wm).length>0):[];
  const isCurW=wm.getTime()===todayMon.getTime();
  return(
    <div>
      <div style={{padding:'10px 12px 4px',background:'white',borderBottom:'1px solid #e8eaed',position:'sticky',top:140,zIndex:37}}>
        <div className="mob-search" style={{margin:0}}>
          <span style={{fontSize:14,color:'#adb5bd'}}>🔍</span>
          <input placeholder="Sök projekt…" value={search} onChange={e=>{setSearch(e.target.value);setSelId('');}}/>
          {search&&<button onClick={()=>setSearch('')} style={{border:'none',background:'none',color:'#9ca3af',fontSize:16,cursor:'pointer'}}>✕</button>}
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'nowrap',overflowX:'auto',padding:'8px 0 2px',WebkitOverflowScrolling:'touch'}}>
          {filtered.slice(0,15).map(p=>(
            <button key={p.id} onClick={()=>setSelId(selId===p.id?'':p.id)} className={'mob-proj-pill'+(selId===p.id?' active':'')}>
              {p.id}{p.name&&p.name!==p.id?' — '+p.name:''}
            </button>
          ))}
        </div>
      </div>
      <div className="mob-content">
        {!selId&&<div className="mob-empty">Välj ett projekt ovan</div>}
        {selId&&selProj&&(
          <>
            <div style={{background:'white',borderRadius:10,padding:'12px 14px',marginBottom:10,boxShadow:'0 1px 3px rgba(0,0,0,.06)'}}>
              <div style={{fontFamily:'monospace',fontWeight:700,fontSize:15,color:'#1a1a2e'}}>{selProj.id}</div>
              <div style={{fontSize:13,color:'#6c757d',marginTop:2}}>{selProj.name||selProj.id}</div>
              <div style={{fontSize:11,color:'#9ca3af',marginTop:2}}>PL: {plName(selProj.pl)}</div>
            </div>
            <div style={{fontSize:12,fontWeight:600,color:'#6c757d',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:8}}>
              {isCurW?'Denna vecka':'V'+wnum(wm)} · {bookedRes.length} {bookedRes.length===1?'resurs':'resurser'}
            </div>
            {bookedRes.length===0&&<div className="mob-empty" style={{padding:'20px 0'}}>Inga bokningar denna vecka</div>}
            {bookedRes.map(res=>{
              const hrs=bdaysOf(bookings,res.id,selId,wm).length*8;
              const hkV=hosKund[res.id+'__'+selId+'__'+iso(wm)];
              return(
                <div key={res.id} className="mob-res-row">
                  <div className="mob-av" style={Object.assign({width:32,height:32,fontSize:10},res.type==='konsult'?{background:'#7c3aed'}:{})}>{res.initials}</div>
                  <div>
                    <div style={{fontSize:13,fontWeight:600,color:'#1a1a2e'}}>{res.name}</div>
                    <div style={{fontSize:11,color:'#9ca3af'}}>{res.role||'—'}{hkV&&<span style={{marginLeft:6,color:'#f06820',fontWeight:600}}>Hos kund</span>}</div>
                  </div>
                  <div className="mob-res-hrs">{hrs}h</div>
                </div>
              );
            })}
          </>
        )}
      </div>
    </div>
  );
}

      <div className="fsearch"><span style={{fontSize:13,color:'#adb5bd'}}>🔍</span><input placeholder="Sök person…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
      {[...COMPETENCIES,'Konsult'].map(c=>{
        const active=roles.has(c);
        return<button key={c} onClick={()=>togRole(c)} style={{padding:'4px 10px',borderRadius:6,border:'1.5px solid',borderColor:active?'#1a1a2e':'#dee2e6',background:active?'#1a1a2e':'white',color:active?'white':'#495057',fontSize:12,fontWeight:active?600:400,cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>{c}</button>;

      {(search||roles.size>0)&&<button className="fclear" onClick={()=>{setSearch('');setRoles(new Set());}}>✕ Rensa</button>}

}

function FinderResBody({res,proj,weeks,bookings,hosKund,dayBookings,projMap,resProjs,seenResProjs,nonLedigProjs,todayMon,openModal,toggleWeek,onCtxMenu,isAdmin,onAddForRes}){
  const ledigProj=projMap['LEDIG']||{id:'LEDIG',name:'Ledig / Semester'};
  const bookedProjs=sortProjs(nonLedigProjs.filter(p=>resProjs[res.id]?.has(p.id)||seenResProjs.has(res.id+'__'+p.id)));
  const hasLedig=weeks.some(wm=>wdays(wm).some(d=>isB(bookings,res.id,'LEDIG',d)));
  const activeProjs=[...(hasLedig?[ledigProj]:[]),...bookedProjs];
  const bg='#f4f5f7';const bgDr='#f8f9fa';
  return(
    <React.Fragment>
      <tbody style={{borderTop:'2px solid #d1d5db'}}>
        <tr className="sr" style={{background:bg}}>
          <td className="c-person" style={{background:bg}}>
            <div className="person-cell">
              <div className="res-av" style={res.type==='konsult'?{background:'#7c3aed'}:{}}>{res.initials}</div>
              <div className="person-info">
                <div className="person-name">{res.name}{res.type==='konsult'&&<span style={{marginLeft:5,fontSize:9,fontWeight:700,background:'#7c3aed',color:'white',borderRadius:3,padding:'1px 4px',verticalAlign:'middle'}}>KONSULT</span>}</div>
                <div className="person-role-sub">{res.type==='konsult'?res.company||res.role:res.role}</div>
              </div>
              {isAdmin&&<button className="person-add-btn" title="Lägg till projekt" onClick={e=>{e.stopPropagation();onAddForRes(res.id);}}>＋</button>}
            </div>
          </td>
          <td className="c-proj" style={{background:bg}}/>
          {weeks.map(wm=>{
            const isPast=wm<todayMon;
            const hrs=nonLedigProjs.reduce((s,p)=>s+bdaysOf(bookings,res.id,p.id,wm).length*8,0);
            const ledHrs=bdaysOf(bookings,res.id,'LEDIG',wm).length*8;
            const tot=hrs+ledHrs;
            return(
              <td key={iso(wm)} className={'td-week'+(isPast?' is-past':'')} style={{padding:3,background:bg}}>
                {ledHrs>0&&hrs===0
                  ?<div className="wchip red" style={{fontSize:9}}>{ledHrs}h</div>
                  :<div className="sc"><span className="sc-hrs" style={{color:tot>0?'#1a1a2e':'#adb5bd'}}>{tot>0?tot+'h':'—'}</span></div>
                }
              </td>
            );
          })}
        </tr>
      </tbody>
      {activeProjs.map(p=>{
        const isLedig=p.id==='LEDIG';
        const wkHrs=weeks.reduce((s,wm)=>s+bdaysOf(bookings,res.id,p.id,wm).length*8,0);
        const displayName=projMap[p.id]?.name||p.name||p.id;
        return(
          <tbody key={p.id}>
            <tr className="dr" style={{background:bgDr}}>
              <td className="c-person" style={{background:bgDr}}>
                {isLedig
                  ?<div style={{padding:'5px 10px',paddingBottom:5,display:'flex',alignItems:'center',gap:6}}>
                     <div style={{width:7,height:7,borderRadius:'50%',background:'#e63946',flexShrink:0}}/>
                     <span style={{fontSize:12,fontWeight:600,color:'#e63946'}}>Ledig</span>
                   </div>
                  :<div className="proj-sc" style={{paddingLeft:8}}>
                     <div className="proj-sc-top">
                       <div className="proj-sc-id" style={{flex:1,minWidth:0,display:'flex',alignItems:'center',flexWrap:'nowrap',overflow:'hidden'}}>
                         <div className="pjdot" style={{flexShrink:0}}/>
                         <span className="pjcode" style={{flexShrink:0}}>{p.id}</span>
                         {displayName&&displayName!==p.id&&<span className="pjname">{displayName}</span>}
                       </div>
                     </div>
                   </div>
                }
              </td>
              <td className="c-proj" style={{background:bgDr}}>
                <div style={{padding:'3px 6px',fontSize:11,fontWeight:700,color:'#374151',textAlign:'center'}}>{wkHrs>0?wkHrs+'h':'—'}</div>
              </td>
              {weeks.map(wm=>{
                const isPast=wm<todayMon;
                const bd=bdaysOf(bookings,res.id,p.id,wm);
                const hkVal=hosKund[res.id+'__'+p.id+'__'+iso(wm)];
                const periodDays=res.type==='konsult'?workDays(wm).filter(({d})=>consultAvail(res,d)):workDays(wm);
                const allOutside=res.type==='konsult'&&periodDays.length===0;
                const free=periodDays.filter(({d})=>!resBlockedDay(dayBookings,res.id,p.id,d));
                return(
                  <td key={iso(wm)} className={'td-week'+(isPast?' is-past':'')} style={{padding:3,background:bgDr}}
                    onClick={isPast||allOutside||isLedig?undefined:bd.length?(()=>openModal(res.id,proj.id,wm)):(()=>{if(free.length===0)return;free.length<workDays(wm).length?openModal(res.id,proj.id,wm):toggleWeek(res.id,proj.id,wm);})}
                    onContextMenu={!isPast&&!allOutside&&bd.length?(e=>{e.preventDefault();onCtxMenu(res.id,proj.id,wm,e.clientX,e.clientY);}):undefined}>
                    {allOutside?<div className="wchip-outside"/>
                     :bd.length>0?<div className={'wchip'+(isLedig?' red':hkVal?' hk':'')} style={{fontSize:9}}>{bd.length*8}h</div>
                     :free.length===0?<div className="wchip-off"/>
                     :<div className="wchip-e"/>
                    }
                  </td>
                );
              })}
            </tr>

/* ════════════ WCHIP KONTEXTMENY ════════════ */
function WchipCtxMenu({r,p,mon,x,y,hosKund,isAdmin,onToggleHk,onEdit,onDelete,onClose}){
  const isHk=isHkForWeek(hosKund,r,p,mon);
  const ref=React.useRef(null);
  const onCloseRef=React.useRef(onClose);
  onCloseRef.current=onClose;
  useEffect(()=>{
    function onDown(e){if(ref.current&&!ref.current.contains(e.target))onCloseRef.current();}
    document.addEventListener('mousedown',onDown);
    return()=>document.removeEventListener('mousedown',onDown);
  },[]);
  // Justera position om menyn riskerar att gå utanför skärmen
  const menuW=170,menuH=120;
  const left=x+menuW>window.innerWidth?x-menuW:x;
  const top=y+menuH>window.innerHeight?y-menuH:y;
  const row=(label,icon,color,onClick,sep)=>(
    <div onMouseDown={e=>{e.stopPropagation();onClick();}}
      style={{padding:'8px 14px',cursor:'pointer',fontSize:13,color:color||'#1a1a2e',display:'flex',alignItems:'center',gap:8,borderTop:sep?'1px solid #f0f2f5':undefined,userSelect:'none'}}
      onMouseEnter={e=>e.currentTarget.style.background='#f0f2f5'}
      onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
      <span style={{width:14,fontSize:11}}>{icon}</span>{label}
    </div>
  );
  return(
    <div ref={ref} style={{position:'fixed',left,top,zIndex:9999,background:'white',border:'1px solid #dee2e6',borderRadius:8,boxShadow:'0 4px 20px rgba(0,0,0,.15)',minWidth:170,padding:'4px 0',overflow:'hidden'}}>
      {isAdmin&&row(isHk?'✓ Hos kund':'Hos kund','🏢','#f06820',onToggleHk)}
      {row('Redigera...','✏️',undefined,onEdit,isAdmin)}
      {isAdmin&&row('Ta bort vecka','🗑️','#e63946',onDelete,true)}
    </div>
  );
}

    if(Array.isArray(modal.hosKundVal)){
      return wdays(modal.mon).map(d=>modal.hosKundVal.includes(iso(d)));
    }
    return [true,true,true,true,true];
  });
  const proj=projMap[modal.p],res=resources.find(r=>r.id===modal.r);

function NewBookingModal({weeks,resources,projects,preRes,todayMon,onSave,onSaveMulti,onClose}){
  const [r,setR]=useState(preRes||'');const [p,setP]=useState('');
  const [selWeeks,setSelWeeks]=useState(new Set());const [days,setDays]=useState([true,true,true,true,true]);
  const PAGE_SIZE=5;
  const [startIdx,setStartIdx]=useState(()=>{
    if(!todayMon)return 0;
    const idx=weeks.findIndex(wm=>iso(wm)>=iso(todayMon));
    return idx>=0?idx:0;
  });
  const maxStart=Math.max(0,weeks.length-PAGE_SIZE);
  const visWeeks=weeks.slice(startIdx,startIdx+PAGE_SIZE);
  function togWeek(wm){const k=iso(wm);setSelWeeks(prev=>{const n=new Set(prev);n.has(k)?n.delete(k):n.add(k);return n;});}
  function selAll(){setSelWeeks(prev=>{const n=new Set(prev);visWeeks.forEach(wm=>n.add(iso(wm)));return n;});}
  function deselAll(){setSelWeeks(prev=>{const n=new Set(prev);visWeeks.forEach(wm=>n.delete(iso(wm)));return n;});}
  const refWm=weeks.find(wm=>selWeeks.has(iso(wm)))||weeks[0];
  const refWd=wdays(refWm);
  function tog(i){if(isDayOff(refWd[i]))return;setDays(prev=>{const n=[...prev];n[i]=!n[i];return n;});}
  const selCount=selWeeks.size;
  function save(){
    if(!r||!p||!selCount||!days.some(Boolean))return;
    const selWms=weeks.filter(wm=>selWeeks.has(iso(wm)));
    if(selWms.length===1){onSave(r,p,selWms[0],days);}else{onSaveMulti(r,p,selWms,days);}
  }
  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{maxWidth:520}} onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Ny bokning</div>
        <div className="field"><label>Person</label><select value={r} onChange={e=>setR(e.target.value)}><option value="">Välj person…</option>{[...resources.filter(x=>x.active)].sort((a,b)=>{const ak=a.type==='konsult'?1:0,bk=b.type==='konsult'?1:0;return ak!==bk?ak-bk:a.name.localeCompare(b.name,'sv');}).map(x=><option key={x.id} value={x.id}>{x.name} ({x.role})</option>)}</select></div>
        <div className="field"><label>Projekt</label><select value={p} onChange={e=>setP(e.target.value)}><option value="">Välj projekt…</option>{sortProjs(projects).map(x=><option key={x.id} value={x.id}>{x.id}{x.name&&x.name!==x.id?` — ${x.name}`:''}</option>)}</select></div>
        <div className="field" style={{marginBottom:8}}>
          <label style={{display:'flex',alignItems:'center',gap:8}}>Välj veckor {selCount>0&&<span style={{background:'#1a1a2e',color:'white',borderRadius:10,padding:'1px 8px',fontSize:11,fontWeight:700}}>{selCount} valda</span>}</label>
          <div style={{border:'1.5px solid #e2e8f0',borderRadius:8,overflow:'hidden',marginTop:4}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'7px 12px',background:'#f8f9fa',borderBottom:'1px solid #e2e8f0'}}>
              <div style={{display:'flex',gap:1}}>
                <button onClick={()=>setStartIdx(i=>Math.max(0,i-PAGE_SIZE))} disabled={startIdx===0} title="5 veckor bakåt" style={{background:'none',border:'none',cursor:'pointer',fontSize:15,color:startIdx===0?'#adb5bd':'#374151',lineHeight:1,padding:'0 3px'}}>«</button>
                <button onClick={()=>setStartIdx(i=>Math.max(0,i-1))} disabled={startIdx===0} title="1 vecka bakåt" style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:startIdx===0?'#adb5bd':'#374151',lineHeight:1,padding:'0 2px'}}>‹</button>
              </div>
              <span style={{fontWeight:600,fontSize:12,color:'#6c757d'}}>V{wnum(visWeeks[0])} – V{wnum(visWeeks[visWeeks.length-1])}</span>
              <div style={{display:'flex',gap:1}}>
                <button onClick={()=>setStartIdx(i=>Math.min(maxStart,i+1))} disabled={startIdx>=maxStart} title="1 vecka framåt" style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:startIdx>=maxStart?'#adb5bd':'#374151',lineHeight:1,padding:'0 2px'}}>›</button>
                <button onClick={()=>setStartIdx(i=>Math.min(maxStart,i+PAGE_SIZE))} disabled={startIdx>=maxStart} title="5 veckor framåt" style={{background:'none',border:'none',cursor:'pointer',fontSize:15,color:startIdx>=maxStart?'#adb5bd':'#374151',lineHeight:1,padding:'0 3px'}}>»</button>
              </div>
            </div>
            <div>
              {visWeeks.map(wm=>{
                const k=iso(wm);const sel=selWeeks.has(k);
                const wd2=wdays(wm);
                return(
                  <div key={k} onClick={()=>togWeek(wm)} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',cursor:'pointer',background:sel?'#eef2ff':'white',borderLeft:sel?'3px solid #1a1a2e':'3px solid transparent',borderBottom:'1px solid #f0f2f5',userSelect:'none',transition:'background .1s'}}>
                    <div style={{width:16,height:16,borderRadius:4,border:sel?'none':'2px solid #d1d5db',background:sel?'#1a1a2e':'white',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                      {sel&&<span style={{color:'white',fontSize:10,lineHeight:1,fontWeight:700}}>✓</span>}
                    </div>
                    <span style={{fontSize:12,fontWeight:700,color:'#374151',flexShrink:0,minWidth:28}}>V{wnum(wm)}</span>
                    <span style={{fontSize:11,color:'#6c757d'}}>{fmt(wd2[0])} – {fmt(wd2[wd2.length-1])}</span>
                  </div>
                );
              })}
            </div>
            <div style={{padding:'6px 12px',background:'#f8f9fa',borderTop:'1px solid #e2e8f0',display:'flex',gap:8}}>
              <button onClick={selAll} style={{fontSize:11,padding:'3px 10px',border:'1.5px solid #d1d5db',borderRadius:4,background:'white',cursor:'pointer',color:'#374151'}}>Välj alla</button>
              <button onClick={deselAll} style={{fontSize:11,padding:'3px 10px',border:'1.5px solid #d1d5db',borderRadius:4,background:'white',cursor:'pointer',color:'#374151'}}>Rensa</button>
            </div>
          </div>
        </div>
        <div className="field"><label>Dagar (gäller alla valda veckor)</label><div className="dpick">{DAY_LABELS.map((l,i)=>{const off=isDayOff(refWd[i]);return(<button key={i} className={`dtog${off?' hday':days[i]?' on':''}`} onClick={()=>tog(i)}>{off?'H':l}</button>);})}</div></div>
        <div className="modal-actions">
          <button className="btn btn-cancel" onClick={onClose}>Avbryt</button>
          <button className="btn btn-save" disabled={!r||!p||!selCount||!days.some(Boolean)} onClick={save}>{selCount>1?`Spara ${selCount} veckor`:'Spara bokning'}</button>
        </div>
      </div>
    </div>
  );
}

    setEditItem(null);

                  </div>
                  <button onClick={()=>openEdit(res)} style={{fontSize:11,padding:'3px 10px',border:'1.5px solid #d1d5db',borderRadius:5,background:'white',cursor:'pointer',color:'#374151',flexShrink:0}}>Hantera</button>
